<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1119">
<title>The Long Ride</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --ink:#0E1119; --ink-2:#161B27; --ink-3:#1F2634;
  --bone:#E9E3D5; --bone-dim:#A9A290;
  --brass:#C9922F; --verdigris:#6E9285; --rust:#94433A;
  --rule:#2C3444;
  --serif:"Hoefler Text","Baskerville","Palatino Linotype",Palatino,Georgia,serif;
  --sans:"Avenir Next","Segoe UI",Roboto,system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--ink);color:var(--bone);font-family:var(--serif);font-size:17px;line-height:1.6}
body{padding-bottom:env(safe-area-inset-bottom)}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.wrap{max-width:760px;margin:0 auto;padding:0 20px 96px}
header.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  padding:20px 0 14px;border-bottom:1px solid var(--rule);margin-bottom:26px;flex-wrap:wrap}
.brand{font-size:23px;letter-spacing:.02em;font-weight:600}
.brand em{font-style:normal;color:var(--brass)}
.top-meta{font-family:var(--sans);font-size:13px;color:var(--bone-dim)}

h1{font-size:40px;line-height:1.12;font-weight:600;margin:0 0 10px}
h2{font-size:25px;font-weight:600;margin:36px 0 12px}
h3{font-size:19px;font-weight:600;margin:22px 0 8px}
p{margin:0 0 14px;max-width:66ch}
.lede{color:var(--bone-dim);max-width:60ch}
.sans{font-family:var(--sans)}
.dim{color:var(--bone-dim)}
.small{font-size:14px}

.btn{background:transparent;border:1px solid var(--rule);color:var(--bone);
  padding:11px 18px;border-radius:2px;cursor:pointer;font-family:var(--sans);font-size:15px}
.btn:hover{border-color:var(--brass);color:var(--brass)}
.btn.primary{background:var(--brass);border-color:var(--brass);color:#15100A;font-weight:600}
.btn.primary:hover{background:#DBA33D;color:#15100A}
.btn.ghost{border-color:transparent;color:var(--bone-dim);padding-left:0}
.btn.ghost:hover{color:var(--brass)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.sm{padding:7px 12px;font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{justify-content:space-between}

input[type=text],textarea,select{width:100%;background:var(--ink-2);border:1px solid var(--rule);
  border-radius:2px;padding:11px 13px;font-family:var(--sans);font-size:15px}
textarea{font-family:var(--serif);font-size:17px;line-height:1.7;min-height:200px;resize:vertical;overflow:hidden}
input[type=text]{font-size:16px}
@media (max-width:520px){textarea{min-height:44vh;font-size:17px}input[type=text],select{font-size:16px}}
label.fld{display:block;font-family:var(--sans);font-size:13px;color:var(--bone-dim);margin:0 0 6px}

/* lens picker */
.lens-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule)}
.lens{background:var(--ink);padding:16px 17px;text-align:left;cursor:pointer;border:0;display:block;width:100%}
.lens:hover{background:var(--ink-2)}
.lens[aria-pressed=true]{background:var(--ink-3);box-shadow:inset 3px 0 0 var(--brass)}
.lens .ln{font-size:19px;font-weight:600;margin-bottom:2px}
.lens .lscope{font-family:var(--sans);font-size:12.5px;color:var(--brass)}
.lens .ldesc{font-family:var(--sans);font-size:13px;color:var(--bone-dim);margin-top:7px;line-height:1.45}

/* deck guidance */
.deckbox{border:1px solid var(--rule);border-left:3px solid var(--verdigris);padding:15px 18px;margin:22px 0;background:var(--ink-2)}
.deckbox h4{margin:0 0 8px;font-size:16px;font-weight:600;color:var(--verdigris)}
.deckbox ul{margin:0;padding-left:19px;font-family:var(--sans);font-size:14.5px;line-height:1.6}
.deckbox li{margin-bottom:5px}

/* the drawn card — the hero */
.card-stage{border:1px solid var(--rule);background:linear-gradient(180deg,var(--ink-2),var(--ink));padding:30px 26px;margin:22px 0;position:relative}
.card-stage.rev{border-color:var(--rust)}
.card-arcana{font-family:var(--sans);font-size:12.5px;color:var(--bone-dim);margin-bottom:9px}
.card-name{font-size:36px;line-height:1.1;font-weight:600;margin:0 0 4px}
.card-stage.rev .card-name{color:var(--rust)}
.card-trad{font-family:var(--sans);font-size:14px;color:var(--bone-dim);margin-bottom:16px}
.card-orient{display:inline-block;font-family:var(--sans);font-size:12px;letter-spacing:.06em;
  border:1px solid var(--rule);padding:3px 9px;border-radius:2px;color:var(--bone-dim);margin-bottom:16px}
.card-stage.rev .card-orient{border-color:var(--rust);color:var(--rust)}
.meaning{border-top:1px solid var(--rule);padding-top:15px;margin-top:4px}
.meaning .lbl{font-family:var(--sans);font-size:12.5px;color:var(--bone-dim);margin-bottom:4px}
.prompt{font-size:21px;line-height:1.45;color:var(--brass);margin:0 0 16px;max-width:60ch}
.reminder{font-family:var(--sans);font-size:14.5px;color:var(--bone-dim);line-height:1.55;max-width:66ch}

.chapline{font-family:var(--sans);font-size:13px;color:var(--bone-dim);
  display:flex;gap:14px;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid var(--rule);margin-bottom:6px}
.chapline b{color:var(--bone);font-weight:600}

/* log entries */
.entry{border-left:2px solid var(--rule);padding:2px 0 2px 16px;margin:0 0 20px}
.entry.rev{border-left-color:var(--rust)}
.entry .ehead{font-size:19px;font-weight:600}
.entry .emeta{font-family:var(--sans);font-size:12.5px;color:var(--bone-dim);margin-bottom:6px}
.entry .eprompt{color:var(--brass);font-size:16px;margin-bottom:6px}
.entry .etext{white-space:pre-wrap}
.entry.nested{margin-left:22px;border-left-style:dashed}

/* named register */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--rule);border-radius:2px;padding:6px 11px;font-family:var(--sans);font-size:13.5px;
  background:var(--ink-2);cursor:pointer}
.chip:hover{border-color:var(--brass);color:var(--brass)}
.chip .k{color:var(--bone-dim);font-size:11.5px}


/* ---- session header ---- */
.sesshead{margin:4px 0 18px}
.sesstitle{font-size:29px;font-weight:600;line-height:1.15;cursor:pointer;display:inline-block}
.sesstitle:hover .pencil{color:var(--brass)}
.pencil{font-family:var(--sans);font-size:12px;color:var(--rule);vertical-align:middle;
  border:1px solid var(--rule);padding:2px 7px;border-radius:2px;margin-left:8px}
.sessmeta{font-family:var(--sans);font-size:13px;color:var(--bone-dim);margin-top:4px}

/* ---- framework strip ---- */
.frame{border:1px solid var(--rule);border-top:3px solid var(--verdigris);background:var(--ink-2);
  padding:15px 17px;margin:14px 0}
.frame-h{font-family:var(--sans);font-size:13px;letter-spacing:.04em;color:var(--verdigris);margin-bottom:11px}
.steps{display:flex;flex-wrap:wrap;gap:7px}
.step{display:flex;align-items:center;gap:7px;border:1px solid var(--rule);padding:5px 10px;border-radius:2px;
  font-family:var(--sans);font-size:12.5px;color:var(--bone-dim)}
.step .sn{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;
  border-radius:50%;border:1px solid var(--rule);font-size:11px}
.step.done{color:var(--bone-dim);opacity:.55}
.step.done .sn{background:var(--rule);border-color:var(--rule)}
.step.now{color:var(--brass);border-color:var(--brass)}
.step.now .sn{border-color:var(--brass);color:var(--brass)}

/* ---- lens brief ---- */
.brief{border:1px solid var(--rule);background:var(--ink-2);padding:16px 18px;margin:16px 0}
.brief-h{display:flex;justify-content:space-between;align-items:center;gap:12px;
  font-size:18px;margin-bottom:12px;border-bottom:1px solid var(--rule);padding-bottom:9px}
.klbl{font-family:var(--sans);font-size:11.5px;letter-spacing:.05em;color:var(--verdigris);
  display:block;margin-bottom:3px}
.brief p{margin:0 0 10px}
.suitgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;
  background:var(--rule);border:1px solid var(--rule);margin:12px 0}
.suitcell{background:var(--ink);padding:10px 12px;font-family:var(--sans);font-size:13.5px;line-height:1.45}
.brieful{margin:0;padding-left:19px;font-family:var(--sans);font-size:14px;line-height:1.6}
.brieful li{margin-bottom:5px}

/* ---- scale picker ---- */
.scale-opts{display:grid;gap:1px;background:var(--rule);border:1px solid var(--rule)}
.scale-opt{background:var(--ink);border:0;text-align:left;padding:14px 16px;cursor:pointer;
  display:block;width:100%;color:var(--bone)}
.scale-opt b{font-size:17px;font-weight:600;display:block;margin-bottom:3px}
.scale-opt span{font-family:var(--sans);font-size:13.5px;color:var(--bone-dim);line-height:1.45}
.scale-opt:hover{background:var(--ink-2)}
.scale-opt.sel{background:var(--ink-3);box-shadow:inset 3px 0 0 var(--brass)}
.scale-opt.sel b{color:var(--brass)}

/* ---- chapter arc list ---- */
.arcrow{display:flex;gap:12px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--rule)}
.arcrow:last-child{border-bottom:0}
.arcnum{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;
  border:1px solid var(--verdigris);color:var(--verdigris);border-radius:50%;
  font-family:var(--sans);font-size:12px;flex-shrink:0}
.arcrow b{font-size:16px}


/* ---- tables & engines ---- */
select{width:100%;background:var(--ink-2);border:1px solid var(--rule);border-radius:2px;
  padding:11px 13px;font-family:var(--sans);font-size:16px}
.eng-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:1px;
  background:var(--rule);border:1px solid var(--rule);margin:12px 0 26px}
.eng{background:var(--ink);padding:14px 16px;text-align:left;border:0;cursor:pointer;color:var(--bone);display:block;width:100%}
.eng:hover{background:var(--ink-2)}
.eng .en{font-size:17px;font-weight:600;margin-bottom:3px}
.eng .eu{font-family:var(--sans);font-size:13px;color:var(--bone-dim);line-height:1.45}
.eng .es{font-family:var(--sans);font-size:11.5px;color:var(--verdigris);margin-top:6px}
.tbl-list{border:1px solid var(--rule);margin-top:12px}
.tbl-row{display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:11px 14px;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.tbl-row:last-child{border-bottom:0}
.tbl-info{font-family:var(--sans);font-size:14px;line-height:1.4}
.tag{font-family:var(--sans);font-size:10.5px;letter-spacing:.05em;border:1px solid var(--brass);
  color:var(--brass);padding:1px 6px;border-radius:2px}

/* ---- roll results ---- */
.res-list{margin:18px 0}
.res{border:1px solid var(--rule);border-left:3px solid var(--brass);background:var(--ink-2);
  padding:13px 16px;margin-bottom:10px}
.res.opt{border-left-color:var(--verdigris);opacity:.9}
.res-l{font-family:var(--sans);font-size:12px;letter-spacing:.04em;color:var(--verdigris);
  display:flex;justify-content:space-between;gap:10px;margin-bottom:5px;flex-wrap:wrap}
.res-src{color:var(--rule);font-size:11px}
.res-t{font-size:19px;line-height:1.4}
.res-d{font-family:var(--sans);font-size:12px;color:var(--bone-dim);margin-top:7px;line-height:1.5}
.res .btn.sm{margin-top:9px;padding-left:0}

/* ---- offer strip ---- */
.offer{border:1px dashed var(--rule);padding:12px 14px;margin:18px 0;background:rgba(110,146,133,.05)}
.offer-h{font-family:var(--sans);font-size:12px;letter-spacing:.04em;color:var(--verdigris);margin-bottom:9px}
.offer-row{display:flex;flex-wrap:wrap;gap:7px}
.chipbtn{background:var(--ink);border:1px solid var(--rule);color:var(--bone);border-radius:2px;
  padding:7px 12px;font-family:var(--sans);font-size:13px;cursor:pointer}
.chipbtn:hover{border-color:var(--brass);color:var(--brass)}
.chipbtn.alt{color:var(--bone-dim);border-style:dashed}
.steprow{display:grid;grid-template-columns:1fr 1.4fr;gap:8px;margin-bottom:8px}
@media (max-width:520px){.steprow{grid-template-columns:1fr}}
code{font-family:var(--sans);font-size:13px;background:var(--ink-3);padding:1px 5px;border-radius:2px}


/* ---- in-app dialogs ---- */
.dlg-wrap{position:fixed;inset:0;background:rgba(6,8,13,.78);display:flex;align-items:center;
  justify-content:center;padding:22px;z-index:100}
.dlg{background:var(--ink-2);border:1px solid var(--brass);max-width:440px;width:100%;padding:22px 24px}
.dlg-m{font-size:18px;line-height:1.5;margin:0 0 16px}

/* ---- paste chooser ---- */
.pastebox{border:1px solid var(--rule);border-top:3px solid var(--brass);background:var(--ink-2);padding:16px 18px}
.pick-list{margin:6px 0 4px}
.pick{display:flex;gap:10px;align-items:flex-start;padding:7px 0;font-family:var(--sans);
  font-size:14px;line-height:1.45;cursor:pointer;border-bottom:1px solid var(--rule)}
.pick:last-child{border-bottom:0}
.pick input{margin-top:3px;width:18px;height:18px;flex-shrink:0;accent-color:var(--brass)}
.pick b{color:var(--verdigris);font-weight:600}
.preview{border:1px solid var(--rule);background:var(--ink);padding:12px 14px;margin-top:14px}
.pv-l{font-family:var(--sans);font-size:11px;letter-spacing:.05em;color:var(--verdigris);margin:8px 0 3px}
.pv-l:first-of-type{margin-top:0}
.pv-t{white-space:pre-wrap;font-size:15px;line-height:1.5}

hr.rule{border:0;border-top:1px solid var(--rule);margin:30px 0}
.hidden{display:none!important}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:var(--ink-3);
  border:1px solid var(--brass);color:var(--bone);padding:11px 18px;font-family:var(--sans);font-size:14px;z-index:50}
.suggest{border:1px solid var(--rule);border-top:0;background:var(--ink-2);max-height:210px;overflow:auto}
.suggest button{display:block;width:100%;text-align:left;background:transparent;border:0;padding:9px 13px;
  cursor:pointer;font-family:var(--sans);font-size:14.5px}
.suggest button:hover,.suggest button.sel{background:var(--ink-3);color:var(--brass)}
@media print{body{background:#fff;color:#000}.noprint{display:none!important}
  .entry{border-left:2px solid #999}.prompt,.eprompt{color:#6b4d10}}
@media (max-width:520px){h1{font-size:31px}.card-name{font-size:29px}.prompt{font-size:19px}}
</style>
</head>
<body>
<div class="wrap">
<header class="top">
  <div class="brand">The Long <em>Ride</em></div>
  <div class="top-meta" id="topmeta"></div>
</header>
<main id="app"></main>
</div>
<div id="toast" class="toast hidden"></div>
<script>
/* ============ CARD DATA ============ */
var MAJORS=[
 ["The Drifter","The Fool","Arrival; the unknown outsider; a beginning with no past","Beginnings, innocence, a leap taken without looking.","Recklessness, a false start, someone who should never have come."],
 ["The Huckster","The Magician","A promise, a trick, a bargain; cleverness for sale","Will made manifest; skill, persuasion, resourcefulness.","Manipulation, a con, power misused, an empty promise."],
 ["The Widow","The High Priestess","A secret; hidden knowledge; what is kept quiet","Intuition, the unseen, knowledge deliberately held back.","Secrets rotting, withheld truth, cut off from what you know."],
 ["The Homestead","The Empress","Roots; growth; nurture; what is built to last","Abundance, fertility, care, creation, the land giving freely.","Neglect, smothering, barren ground, care that suffocates."],
 ["The Cattle Baron","The Emperor","Authority; control; who is really in charge","Structure, dominion, protection through order and law.","Tyranny, rigidity, authority that has rotted from inside."],
 ["The Circuit Preacher","The Hierophant","Doctrine; tradition; institution; rules handed down","Shared belief, teaching, orthodoxy, the weight of custom.","Dogma, hypocrisy, a tradition cracking, belief without faith."],
 ["The Reckoning","The Lovers","A choice between two; alliance or rupture","Union, values aligned, a decision that defines everything after.","Discord, a bond broken, choosing badly, temptation."],
 ["The Stagecoach","The Chariot","Momentum; haste; a deadline; the unstoppable","Drive, victory through control, forward motion held together.","Careening, losing the reins, a journey with no destination."],
 ["The Sheriff","Strength","Endurance; holding firm against real danger","Courage, patience, mastery through gentleness not force.","Doubt, brittle force, a nerve that fails at the wrong moment."],
 ["The Prospector","The Hermit","Isolation; obsession; the one who went too far alone","Solitude, inner search, wisdom bought with loneliness.","Exile, paranoia, an obsession that has eaten someone hollow."],
 ["The Gold Strike","Wheel of Fortune","Fortune's turn; sudden abundance or loss","Cycles, luck, a turning point beyond anyone's control.","The turn goes against you; bad timing, resisting the cycle."],
 ["The Circuit Judge","Justice","Judgment; consequence; a dispute settled","Truth, fairness, cause and effect, the scales made even.","Corruption, an unjust verdict, consequence dodged."],
 ["The Hanged Man","The Hanged Man","Sacrifice; suspension; the price of seeing clearly","Surrender, a new angle bought with loss, willing waiting.","Stalling, a pointless sacrifice, martyrdom performed for show."],
 ["The Range War","Death","An ending; something that cannot come back","Transformation, a clean end, what must be let go of.","Clinging, a slow rot, refusing an ending that already happened."],
 ["The Truce","Temperance","Balance; compromise; two things blended","Moderation, patience, opposites brought into proportion.","Imbalance, a bad mix, a compromise nobody actually honors."],
 ["The Company","The Devil","Bondage; corruption; the hook already in","Dependence, appetite, a chain accepted willingly.","The chain seen for what it is; breaking free, painfully."],
 ["The Railroad","The Tower","Upheaval from outside; nobody voted","Sudden collapse, revelation, false structures falling.","Disaster delayed, or a slower ruin that nobody will name."],
 ["The Watering Hole","The Star","Hope; the rare good thing; renewal","Hope, guidance, healing after hardship, faith restored.","Hope withheld, a promise that dries up, despair."],
 ["The Long Night","The Moon","Fear; illusion; the uncanny; belief versus fact","Uncertainty, the subconscious, what moves out in the dark.","The fog lifting — or a delusion hardening into accepted fact."],
 ["The Boomtown","The Sun","Flourishing; clarity; and what it papers over","Success, vitality, plain truth in daylight, joy earned.","False cheer, a glare that blinds, prosperity borrowed on credit."],
 ["Reckoning Comes Due","Judgement","Old debts; awakening; what comes back around","A calling to account, rebirth, the past returning for its due.","The reckoning refused, or aimed squarely at the wrong person."],
 ["The World","The World","Completion; the final shape; how it is remembered","Wholeness, the end of a cycle, arrival, the circle closed.","An ending that will not close; unfinished business, a loose thread."]
];

var SUITS=[
 ["Six-Guns","Wands","force, conflict, ambition, will, violence"],
 ["Springs","Cups","bonds, sustenance, faith, feeling, community"],
 ["Rails","Swords","law, order, knowledge, schemes, hard truth"],
 ["Claims","Pentacles","wealth, land, property, labor, what is owned or owed"]
];
var RANKS=["Ace","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Page","Knight","Queen","King"];

/* MINORS[suit][rank] = [upright, reversed, the question it asks] */
var MINORS=[
[
 ["A spark of ambition; raw will; a venture begins.","A false start; a spark that never catches; drive misaimed.","What ignites here, and who lit it?"],
 ["Planning; standing at the map, choosing a direction.","Fear of the unknown; a plan made badly or abandoned.","What decision about direction is being weighed?"],
 ["Expansion; foresight; ships sighted coming in.","Overreach; delays; a venture that outran its supply.","What was set in motion earlier that is only now arriving?"],
 ["Homecoming; celebration; a foundation that holds.","A shaky home; a celebration cut short; unsettled ground.","What is being celebrated, and how solid is the ground under it?"],
 ["Scrappy competition; everyone fighting for the same thing.","Conflict avoided; tension driven underground.","Who is scrapping with whom, and over what?"],
 ["Victory; public recognition; riding in acclaimed.","A fall from favor; a hollow win; credit misplaced.","Who gets the credit here, and do they deserve it?"],
 ["Holding high ground against many; a position defended.","Overwhelmed; giving ground; the position abandoned.","What position is being defended against long odds?"],
 ["Swift movement; news travelling fast; everything landing at once.","Delays; scattered effort; a message that never arrives.","What moves fast here, and what news travels with it?"],
 ["Wounded but still on watch; the last stand of a tired guard.","Paranoia; exhaustion; a guard who cannot stand down.","What has been endured, and who is still standing watch?"],
 ["Carrying far too much; a burden that bends the back.","Dropping the load; refusing the burden; handing it off.","What burden is being carried, and by whom?"],
 ["A restless messenger; eager news; a young spark.","Immature enthusiasm; bad news; a messenger not believed.","Who arrives with news or ambition, and how green are they?"],
 ["A headlong charge; daring; passion in motion.","Recklessness; running out of steam; a charge into nothing.","Who charges in without waiting, and what do they run at?"],
 ["Warm magnetic authority; confidence that draws people in.","Demanding, jealous; authority that consumes all the air.","Which woman here holds people by force of personality?"],
 ["A bold commander; vision backed by nerve.","A tyrant; impulse dressed as leadership; a burnt-out chief.","Which man leads by daring, and what is he leading toward?"]
],
[
 ["An outpouring of feeling; new love, new faith, a spring rising.","Blocked feeling; the cup spilled; faith withheld.","What feeling or faith begins to flow here?"],
 ["Two joined; a bond made; a match or a truce of the heart.","Imbalance; a match broken; a bond that never took.","What two are joined, and on what terms?"],
 ["Friendship; celebration; a community glad together.","Gossip; a third party; celebration turned to excess.","Who gathers here, and what are they celebrating?"],
 ["Discontent; the offered cup ignored; apathy amid plenty.","Awakening; accepting the offer at last; interest returning.","What is being offered and refused, and why?"],
 ["Grief over what is spilled; mourning with your back turned.","Recovery; turning at last to what still stands.","What has been lost, and who cannot stop looking at it?"],
 ["Nostalgia; an old kindness; the past reaching forward.","Stuck in the past; a memory kept far too long.","What memory or old kindness still shapes things here?"],
 ["Too many choices; visions and illusions hanging in the air.","Clarity; illusions burned off; a choice finally made.","What tempting possibilities are on offer, and which are real?"],
 ["Walking away from what is nearly enough, to seek more.","Aimless wandering — or a return to what was left behind.","Who walks away from something good, and what are they seeking?"],

<script>

ecific person's presence"],[33,", that seems to have more wear on one side than any use could explain"],[34,", that was clearly crafted for a hand smaller or larger than any local's"],[35,", that keeps time strangely, running fast or slow depending on the company"],[36,", that seems to draw attention it shouldn't reasonably draw"],[37,", that never quite feels finished, though nothing seems obviously missing"],[38,", that carries a maker's mark no smith in the territory recognizes"],[39,", that seems reluctant to leave its owner's side, in a way objects shouldn't be"],[40,", that was clearly repaired more than once, by hands of very different skill"],[41,", that seems to change slightly whenever no one is looking directly at it"],[42,", that carries a faint but persistent chill"],[43,", that seems, somehow, to have a favorite owner among everyone who's ever held it"],[44,", that was clearly made before the current owner was born, despite looking freshly made"],[45,", that seems to work better for strangers than for its actual owner"],[46,", that carries the faint scent of a place its owner has never visited"],[47,", that was clearly meant to be part of a set, the rest of which is missing"],[48,", that seems to arrive back with its owner no matter how many times it's lost"],[49,", that was clearly valuable once, though no one can say why it isn't anymore"],[50,", that seems to hum a different tune depending on the season"],[51,", that was clearly used daily by someone who is now, notably, absent from the owner's stories"],[52,", that seems to always be slightly warmer than the hand holding it"],[53,", that carries a nick or scratch matching an old family scar"],[54,", that seems to have been mended by three different hands over the years"],[55,", that never quite sits right in its intended holder, case, or sheath"],[56,", that seems drawn to open flame without ever quite catching fire"],[57,", that was clearly a prize once, judging by an inscription too worn to read fully"],[58,", that seems to make its owner's handwriting change slightly when nearby"],[59,", that carries a very faint, old bloodstain no cleaning has ever fully removed"],[60,", that seems to attract exactly the right kind of luck at exactly the wrong moment"],[61,", that was clearly built to outlast its owner by design"],[62,", that seems to whisper faintly when carried near running water"],[63,", that carries the initials of someone the current owner insists they've never met"],[64,", that seems reluctant to be used for its original, intended purpose"],[65,", that was clearly crafted during a very specific, narrow window of time"],[66,", that seems to draw the eye of strangers more than it should"],[67,", that carries a very faint but persistent vibration, like a distant engine"],[68,", that seems to have been dropped and recovered more times than makes sense"],[69,", that was clearly meant as a matched pair, its twin long missing"],[70,", that seems to change its exact color slightly under moonlight"],[71,", that carries the faint, unmistakable feel of having been prayed over"],[72,", that seems to resist tarnishing, rusting, or otherwise showing its age"],[73,", that was clearly repurposed from a much larger, original object"],[74,", that seems to fit perfectly into a hand it was never sized for"],[75,", that carries a very faint hum audible only in complete silence"],[76,", that seems to have picked up a habit, or a personality, from its owner"],[77,", that was clearly kept as a memento rather than for practical use"],[78,", that seems, oddly, to improve with age rather than wear down"],[79,", that carries a maker's stamp belonging to a business that never existed"],[80,", that seems to always return to the same spot in its owner's belongings"],[81,", that was clearly gifted under circumstances the owner refuses to discuss"],[82,", that seems slightly out of proportion, as though made from a faulty measurement"],[83,", that carries a very faint scent that changes depending on the weather"],[84,", that seems to have absorbed some habit of speech or gesture from its maker"],[85,", that was clearly forged, carved, or sewn by someone left-handed, though the owner is not"],[86,", that seems to hold its temperature far longer than it reasonably should"],[87,", that carries an inscription in a script the owner has never been able to identify"],[88,", that seems to be missing a small piece that was never, as far as anyone can tell, actually part of it"],[89,", that was clearly used in a way its shape doesn't quite support"],[90,", that seems to draw a specific kind of insect no matter the season"],[91,", that carries the faint impression of having been held very tightly, very often"],[92,", that seems to have more history than its owner is willing to admit to"],[93,", that was clearly repaired using a technique from somewhere far from here"],[94,", that seems to change hands more often than an object like it usually would"],[95,", that carries a very faint charge, like static, that never quite fades"],[96,", that seems to have been named, at some point, by someone who loved it"],[97,", that was clearly built for use in weather this region rarely sees"],[98,", that seems, very faintly, to be ticking, though it has no visible mechanism"],[99,", that carries the quiet certainty, somehow, of having outlived at least one owner"],[100,", that seems to fit only its true owner, and no one else, comfortably"]],"s":"Oddities & Gear","g":"Part 5 \u2014 Expanded Tables (Combination Generators)"},{"id":"NC","n":"Elven Corruption Meaning","d":"d100","r":[[1,"Silverwood was once \"Boscoregina\" (bosco = wood, regina = queen) \u2014 the queen's own wood, where she walked alone"],[2,"Ashcroft was once \"Torrebruciata\" (torre = tower, bruciata = burned) \u2014 the tower that burned the night the kingdom fell"],[3,"Coldwater was once \"Fontefredda\" (fonte = spring, fredda = cold) \u2014 the cold spring where the first price was paid"],[4,"Marrowfield was once \"Collemorte\" (colle = hill, morte = death) \u2014 the hill of the dead, where the last battle was fought"],[5,"Splitridge was once \"Cortespezzata\" (corte = court, spezzata = broken) \u2014 the court that was split among the peoples"],[6,"Duskmere was once \"Vallincantata\" (valle = valley, incantata = enchanted) \u2014 the enchanted valley of the last evening court"],[7,"Thornfield was once \"Giardinodellaregina\" (giardino della regina = garden of the queen) \u2014 the queen's own garden"],[8,"Graymantle was once \"Mantoperduto\" (manto = cloak, perduto = lost) \u2014 the cloak of the fallen, lost with the kingdom"],[9,"Hollowcreek was once \"Fiumesilente\" (fiume = river, silente = silent) \u2014 the silent river where the crown was drowned"],[10,"Wraithbend was once \"Svoltapromessa\" (svolta = turn/bend, promessa = promise) \u2014 the bend where the promise turned back on itself"],[11,"Redrock was once \"Pietrarossa\" (pietra = stone, rossa = red) \u2014 the red stone marking the border of the old court"],[12,"Ironwood was once \"Bosconero\" (bosco = wood, nero = black) \u2014 the black wood where the Dealer first walked among them"],[13,"Deadman's Gulch was once \"Vallesenzafine\" (valle senza fine = valley without end) \u2014 where the last soldiers marched and never returned"],[14,"Buzzard Flat was once \"Pianuraperduta\" (pianura = plain, perduta = lost) \u2014 the lost plain, once the kingdom's granary"],[15,"Widow's Ridge was once \"Crinaledelpianto\" (crinale = ridge, pianto = weeping) \u2014 the ridge of weeping, named for the queen's own grief"],[16,"Rebel Springs was once \"Fontedeltradimento\" (fonte = spring, tradimento = betrayal) \u2014 the spring where the first bargain-breaker drank"],[17,"Steel Gap was once \"Passodiferro\" (passo = pass, ferro = iron) \u2014 the iron pass, once guarded day and night"],[18,"Salt Basin was once \"Bacinodilacrime\" (bacino = basin, lacrime = tears) \u2014 the basin that once caught the queen's own tears"],[19,"Gold Bend was once \"Ansadoro\" (ansa = bend, oro = gold) \u2014 the golden bend, where the treasury once stood"],[20,"Skull Draw was once \"Valledelsilenzio\" (valle = valley, silenzio = silence) \u2014 the valley of silence, after the last cry was heard"],[21,"Whisper Hollow was once \"Cavit\u00e0deisegreti\" (cavit\u00e0 = hollow, segreti = secrets) \u2014 the hollow where every secret of the court was kept"],[22,"Rimrock Peak was once \"Cimadellacorona\" (cima = peak, corona = crown) \u2014 the peak shaped, from certain angles, like a crown"],[23,"Thunder Basin was once \"Bacinodeltuono\" (bacino = basin, tuono = thunder) \u2014 where the sky itself is said to have mourned"],[24,"Blackwater Crossing was once \"Guadonero\" (guado = crossing/ford, nero = black) \u2014 the black crossing where the last refugees fled"],[25,"Stone Hollow was once \"Cavit\u00e0dipietra\" (cavit\u00e0 = hollow, pietra = stone) \u2014 the stone hollow that once held the royal archive"],[26,"Boothill was once \"Collinadellescarpe\" (collina = hill, scarpe = shoes/boots) \u2014 a name worn down from an older, stranger phrase"],[27,"Sagebrush Flat was once \"Pianadeisalvi\" (piana = flat/plain, salvi = the saved) \u2014 the plain where the last survivors gathered"],[28,"Cinder Gap was once \"Passodellacenere\" (passo = pass, cenere = ash) \u2014 the pass of ash, where the capital's smoke still lingered for a season"],[29,"Grave Creek was once \"Fiumedeimorti\" (fiume = river, morti = the dead) \u2014 the river of the dead, renamed twice since"],[30,"Rawhide Ridge was once \"Crinaledellapelle\" (crinale = ridge, pelle = skin) \u2014 a name tied to an old and half-forgotten transformation rite"],[31,"Wagon Notch was once \"Taccadeicarri\" (tacca = notch, carri = wagons/carts) \u2014 the notch where the last royal caravan was seen"],[32,"Mustang Flat was once \"Pianadeicavalli\" (piana = plain, cavalli = horses) \u2014 the plain where the queen's own horses ran wild after the fall"],[33,"Renegade Gulch was once \"Valledeitraditori\" (valle = valley, traditori = traitors) \u2014 the valley where the bargain's first witnesses hid"],[34,"Painted Bluff was once \"Rupedipinta\" (rupe = bluff/cliff, dipinta = painted) \u2014 the bluff that still bears faint pigment from a royal mural"],[35,"Shadow Basin was once \"Bacinodellombra\" (bacino = basin, ombra = shadow) \u2014 the basin where the Dealer's shadow is said to fall longest"],[36,"Tumbleweed Flat was once \"Pianadelvento\" (piana = plain, vento = wind) \u2014 the plain of wind, once the site of the queen's own coronation"],[37,"Bone Ridge was once \"Crinaledelleossa\" (crinale = ridge, ossa = bones) \u2014 a name tied to the last battle's dead, never properly buried"],[38,"Buckhorn Gap was once \"Passodelcorno\" (passo = pass, corno = horn) \u2014 named for a hunting horn said to still sound there some nights"],[39,"Buffalo Wallow was once \"Pozzadeibisonti\" (pozza = wallow/pool, bisonti = bison) \u2014 where the herds are said to have once bowed to the queen's procession"],[40,"Vermilion Bluff was once \"Rupevermiglia\" (rupe = bluff, vermiglia = vermilion/deep red) \u2014 named for the color the stone turns at the exact hour the kingdom fell"],[41,"Frontier Crossing was once \"Guadodelconfine\" (guado = crossing, confine = border) \u2014 the crossing that once marked the kingdom's true edge"],[42,"Longhorn Draw was once \"Vallecoldeicorna\" (valle col = valley with, corna = horns) \u2014 a name garbled from an older phrase about the royal hunt"],[43,"Bandit's Rest was once \"Riposodelfuggiasco\" (riposo = rest, fuggiasco = fugitive) \u2014 where the last of the royal line is said to have finally stopped running"],[44,"Rio Hollow was once \"Cavit\u00e0delfiume\" (cavit\u00e0 = hollow, fiume = river) \u2014 the river-hollow, once the site of a royal bathing pool"],[45,"Antelope Springs was once \"Fontedellagazzella\" (fonte = spring, gazzella = gazelle/antelope) \u2014 a name that predates any antelope ever seen in this territory"],[46,"Rustlin' Gulch was once \"Valledelfruscio\" (valle = valley, fruscio = rustling) \u2014 the valley of rustling, where the court's silk banners are said to still stir on windless nights"],[47,"Panhandle Ridge was once \"Crinaledelmanico\" (crinale = ridge, manico = handle) \u2014 a name garbled from a phrase describing the shape of the queen's own scepter"],[48,"Blackjack Flat was once \"Piananera\" (piana = plain, nera = black) \u2014 the black plain, scorched the night the bargain was struck"],[49,"Gopher Hollow was once \"Cavit\u00e0deitopi\" (cavit\u00e0 = hollow, topi = mice/gophers) \u2014 a name earned honestly, but sitting atop a much older one"],[50,"Whistlin' Draw was once \"Valledelfischio\" (valle = valley, fischio = whistle) \u2014 the valley of the whistle, where the Dealer is said to call his due"],[51,"Rattlesnake Bend was once \"Ansadelserpente\" (ansa = bend, serpente = serpent) \u2014 the serpent's bend, once marked by a royal seal shaped like a coiled snake"],[52,"Bootleg Hollow was once \"Cavit\u00e0delcontrabbando\" (cavit\u00e0 = hollow, contrabbando = smuggling) \u2014 a much newer name laid over a court hiding-place far older"],[53,"Widowmaker Ridge was once \"Crinaledellavedova\" (crinale = ridge, vedova = widow) \u2014 named, some say, for the queen herself"],[54,"Cattlemen's Flat was once \"Pianadeipastori\" (piana = plain, pastori = shepherds) \u2014 the plain of the shepherds, who once tended flocks for the royal table"],[55,"Buckskin Gap was once \"Passodelcuoio\" (passo = pass, cuoio = leather/hide) \u2014 a name tied to an old tanning trade that predates the frontier by centuries"],[56,"Trail's End was once \"Finedelsentiero\" (fine = end, sentiero = trail/path) \u2014 the literal end of the old royal road, which once continued for miles further"],[57,"Roughrider Ridge was once \"Crinaledeicavalieri\" (crinale = ridge, cavalieri = knights/riders) \u2014 the ridge of riders, once patrolled by the queen's own guard"],[58,"Prospect Hollow was once \"Cavit\u00e0dellasperanza\" (cavit\u00e0 = hollow, speranza = hope) \u2014 the hollow of hope, ironically, given what was buried there"],[59,"Placer Creek was once \"Fiumedell'oro\" (fiume = river, oro = gold) \u2014 the river of gold, once diverted deliberately to hide the royal treasury"],[60,"Solitude Basin was once \"Bacinodellasolitudine\" (bacino = basin, solitudine = solitude) \u2014 where the last member of the court is said to have died, entirely alone"],[61,"Sagehen Flat was once \"Pianadellagallina\" (piana = plain, gallina = hen) \u2014 a much humbler name laid over a site once used for royal augury"],[62,"Homestead Ridge was once \"Crinaledellacasa\" (crinale = ridge, casa = home) \u2014 the ridge of home, named for the queen's own birthplace"],[63,"Deadwood Hollow was once \"Cavit\u00e0dellegnosecco\" (cavit\u00e0 = hollow, legno secco = dry wood) \u2014 a name earned honestly, atop ground that once held a living royal orchard"],[64,"Palomino Flat was once \"Pianadoro\" (piana = plain, oro = gold) \u2014 the golden plain, named for the color the grass turns at the exact hour of sunset"],[65,"Cinnabar Ridge was once \"Crinaledelcinabro\" (crinale = ridge, cinabro = cinnabar) \u2014 named for a red mineral once mined exclusively for the royal seal-ink"],[66,"Redrock Canyon was once \"Canyondellapietrarossa\" (canyon, pietra rossa = red stone) \u2014 the canyon of red stone, once the site of the kingdom's execution grounds"],[67,"Tinhorn Flat was once \"Pianadelcorno\" (piana = plain, corno = horn) \u2014 a much newer, mocking name laid over an older, more reverent one"],[68,"Gallows Ridge was once \"Crinaledellaforca\" (crinale = ridge, forca = gallows) \u2014 a grim coincidence, or an old memory the land refuses to let go of"],[69,"Rustbucket Hollow was once \"Cavit\u00e0dellaruggine\" (cavit\u00e0 = hollow, ruggine = rust) \u2014 named for iron deposits that were once mined for royal arm ,"seen walking the roads in a dress that never gets dirty"],[3,"who trades true answers for something you'll miss more than you expect"],[4,"who pays fair prices for things that were never for sale"],[5,"who appears behind lone travelers and says nothing at all"],[6,"who grants wishes in exchange for a name, any name but your own"],[7,"whose music makes the dead dance and the living forget why they're afraid"],[8,"who sells exactly what you need at a price you won't understand until later"],[9,"who arrives exactly when a promise is broken, never sooner"],[10,"who tends the graves of the forgotten and remembers every single name"],[11,"a scarecrow that moves fields at night, always one field over from where you last saw it"],[12,"whose water cures any illness for the price of a memory"],[13,"a prospector's ghost who only appears to those about to strike gold and lose everything for it"],[14,"whose portrait ages in place of whoever hangs it in their home"],[15,"whose horse leaves no tracks and whose face no two witnesses agree on"],[16,"a sound that precedes bad news by exactly one day"],[17,"who performs funerals for people not yet dead"],[18,"a bull said to lead every wild herd in the territory, never caught, never aging"],[19,"seen in mirrors just behind your shoulder, never in front of you"],[20,"who appears at river crossings and asks for something other than coin"],[21,"heard before every major storm, never seen by anyone who lives to describe him fully"],[22,"who marries travelers in dreams and holds them to it upon waking"],[23,"a lawman's ghost who still hangs the guilty, whether or not they've been tried"],[24,"who knows every secret buried in every grave he's ever dug"],[25,"heard in empty houses just before they burn down"],[26,"a pale mare that follows anyone who owes more than they can pay"],[27,"who answers three questions truthfully and a fourth with a lie"],[28,"a mining official who never seems to age and always knows the vein before it's found"],[29,"deputized by no sheriff anyone can name, seen only in towns about to see violence"],[30,"who arrives at every wedding uninvited and leaves before the toast"],[31,"voices heard singing hymns from a church that burned down decades ago"],[32,"who can follow any trail except the one that leads to himself"],[33,"who appears to deliver babies born under ill omens, then vanishes before payment"],[34,"made entirely of salt, who dissolves in rain and reforms by the next dry spell"],[35,"which detaches from its owner exactly once in a lifetime and never returns"],[36,"who rides every orphan train looking for a child who was never aboard"],[37,"who patrols towns between elected sheriffs and answers to no jurisdiction"],[38,"kinder than death but no less final, who offers a choice death does not"],[39,"who mends broken fences overnight in exchange for the first calf born after"],[40,"who waits at river crossings for a bride who drowned before their wedding"],[41,"who marks doomed houses with a symbol only children can see"],[42,"a soldier who still hands out rations to men who died decades ago"],[43,"who preaches real sermons to empty churches at three in the morning"],[44,"whose eyes are said to be old currency from a kingdom no one can name"],[45,"said to grant one true warning a year to whoever hears him first"],[46,"who walks porches after dark offering to braid the hair of sleeping children"],[47,"an empty freight wagon that follows anyone who's cheated a business partner"],[48,"blamed for every cold snap that kills livestock without explanation"],[49,"who trades desert water for a story, and always knows if you're lying"],[50,"said to cry out the name of whoever will die on that land next"],[51,"a blacksmith's ghost who still forges horseshoes no living horse will wear"],[52,"who sells things that were never for sale to buyers who never meant to bid"],[53,"a rainmaker hanged unjustly, said to bring drought to towns that wronged him"],[54,"who mends torn clothing left on arrants no judge ever signed, always for crimes about to happen"],[81,"who trades hot meals for names, and remembers every one she's collected"],[82,"who plays the saloon's piano after closing, always the same unfinished song"],[83,"a scarecrow that walks fields only during a poor harvest"],[84,"married in secret to settle a gambling debt, said to still wait at the altar"],[85,"said to find its way onto the chest of whoever will die enforcing the law next"],[86,"who walks the range during the first hard freeze looking for the husband who left her"],[87,"seen bobbing along fence lines where cattle have gone missing"],[88,"delivered to funeral homes by no one, always sized for someone still living"],[89,"who blesses travelers heading toward danger they don't yet know about"],[90,"a deputy's son killed young, said to warn children away from danger before lawmen arrive"],[91,"seen only by those about to hear the choir themselves"],[92,"a book that writes itself, said to record every unpaid promise in the territory"],[93,"which delivers the truth about a child's parentage the midwife herself won't say aloud"],[94,"who still rings up purchases on a register that was melted down for scrap"],[95,"who tolls church bells in towns that have since torn their churches down"],[96,"who appears to travelers fording rivers alone and asks to be carried across"],[97,"said to strike on its own in courtrooms about to convict an innocent man"],[98,"a shapeshifting drifter who wears the face of whoever last trusted it completely"],[99,"heard shaking a rattle from somewhere just past the edge of the firelight"],[100,"who walks the range every year on the coldest night, looking for a wedding that never happened"]],"s":"Legendary Creature or Bogeyman","g":"Part 6 \u2014 Folklore & Superstition"},{"id":"R","n":"Table R - Event Name Table","d":"d20","r":[[1,"The [Noun] of [Noun] | The Battle of Roncevaux"],[2,"The [Adjective] [Noun] | The Bloody Vigil"],[3,"[Noun] and [Noun] | Sword and Crown" t goes utterly still the instant it is watched"],[49,"It seems, unmistakably, to follow human speech"],[50,"It seems to follow written words on a page as they are read aloud"],[51,"It mimics the call of an animal that died out generations ago"],[52,"It mimics, note for note, the voice of someone long dead"],[53,"It hums a melody no living person taught it"],[54,"It repeats, exactly, a signal once sent by telegraph"],[55,"It echoes a sound from an event that happened long before it was born"],[56,"Every other animal nearby falls dead silent around it"],[57,"Every other animal nearby gathers close, unbidden"],[58,"Every other animal nearby flees the moment it arrives"],[59,"Natural predators refuse, flatly, to hunt it"],[60,"Natural prey approach it without any trace of fear"],[61,"New growth springs up, unnaturally, wherever it steps"],[62,"Plants wither and die along the exact path it walks"],[63,"A sudden storm gathers the moment it appears"],[64,"An unnatural calm settles the moment it appears"],[65,"A cloud of fine dust rises from nowhere around it"],[66,"The ground trembles faintly whenever it draws near"],[67,"People nearby suddenly recall something they had long forgotten"],[68,"People nearby just as suddenly forget something they knew moments ago"],[69,"Someone standing close to it visibly begins to change race"],[70,"It is, by any measure, far older than its species should live to be"],[71,"It is, just as strangely, far younger than it has any right to be"],[72,"It appears to be the very last of a vanished kind"],[73,"It appears to be the very first of a kind that has not existed before"],[74,"It shows physical traits belonging to two unrelated species at once"],[75,"It shows traits belonging, somehow, to several modern races at once"],[76,"It looks, unmistakably, mid-transformation into something else"],[77,"It looks as though a transformation is reversing itself before your eyes"],[78,"Wedged in its coat is a shard of some ancient structure"],[79,"Caught in its claws is a fragment of a royal artifact"],[80,"Tangled in its fur is a torn scrap of an old legal contract"],[81,"Somehow, it seems to be carrying a person's forgotten name"],[82,"It behaves as though it is physically carrying someone's memory"],[83,"It behaves as though it is carrying a curse, and struggling under the weight of it"],[84,"It behaves, instead, as though it carries a blessing"],[85,"It arrives bearing what feels unmistakably like a message from the dead"],[86,"It arrives bearing what feels, just as strongly, like a message from the Dealer"],[87,"It stands guard over a secret it plainly understands the weight of"],[88,"It is, itself, quietly and simply the secret in question"],[89,"It exists, apparently, as the direct result of some old bargain"],[90,"It is, somehow, the price that bargain demanded"],[91,"It represents, whether it knows it or not, a loophole in that bargain"],[92,"It is living, walking evidence that the bargain was ever struck at all"],[93,"It may be the one thing capable of breaking that bargain for good"],[94,"It may, just as easily, be the one thing capable of completing it"],[95,"It was, once, an elf, before something changed that permanently"],[96,"It is a modern creature, slowly and unmistakably becoming an elf"],[97,"It carries within it, somehow, a fragment of the fallen kingdom itself"],[98,"It seems, more than anything, to be the Dealer's quiet way of watching"],[99,"It appears in exactly the same spot in every account, no matter who is telling it"],[100,"Its call, played back, sounds unmistakably like a word in the old elven tongue"]],"s":"Strange Sign","g":"Part 4 \u2014 Wildlife & Ecology"},{"id":"W12","n":"Table W12 \u2014 Creature-to-Creature Relationship","d":"d100","r":[[1,"Hunting",6],[7,"Being hunted",12],[13,"Competing for food",18],[19,"Competing for territory",24],[25,"Fighting",30],[31,"Protecting young",35],[36,"Following",40],[41,"Scavenging from",45],[46,"Using the other as shelter",50],[51,"Accidentally <script>
/* ============ STORAGE ============ */
var MEM={};
var DB={
  get:function(k){try{var v=localStorage.getItem(k);return v==null?(MEM[k]!=null?MEM[k]:null):v}catch(e){return MEM[k]!=null?MEM[k]:null}},
  set:function(k,v){try{localStorage.setItem(k,v)}catch(e){}MEM[k]=v},
  del:function(k){try{localStorage.removeItem(k)}catch(e){}delete MEM[k]}
};
var J=function(k,d){var v=DB.get(k);if(!v)return d;try{return JSON.parse(v)}catch(e){return d}};
var SJ=function(k,o){DB.set(k,JSON.stringify(o))};

/* ============ CARD MODEL ============ */
function majorCard(i){return{t:"major",i:i,west:MAJORS[i][0],trad:MAJORS[i][1],theme:MAJORS[i][2],
  up:MAJORS[i][3],rv:MAJORS[i][4]}}
function minorCard(s,r){return{t:"minor",s:s,r:r,west:RANKS[r]+" of "+SUITS[s][0],trad:RANKS[r]+" of "+SUITS[s][1],
  up:MINORS[s][r][0],rv:MINORS[s][r][1],q:MINORS[s][r][2]}}
function fullDeck(){var d=[],i,s,r;for(i=0;i<22;i++)d.push(majorCard(i));
  for(s=0;s<4;s++)for(r=0;r<14;r++)d.push(minorCard(s,r));return d}
function cardKey(c){return c.t==="major"?"M"+c.i:"m"+c.s+"-"+c.r}
function isCourt(c){return c.t==="minor"&&c.r>=10}

var NUMWORD={1:"Ace",2:"Two",3:"Three",4:"Four",5:"Five",6:"Six",7:"Seven",8:"Eight",9:"Nine",10:"Ten",
  ace:"Ace",one:"Ace",two:"Two",three:"Three",four:"Four",five:"Five",six:"Six",seven:"Seven",eight:"Eight",
  nine:"Nine",ten:"Ten",page:"Page",jack:"Page",knave:"Page",knight:"Knight",queen:"Queen",king:"King"};
function norm(s){return (s||"").toLowerCase().replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim()}
function parseCard(raw){
  var s=norm(raw), rev=false, i;
  s=s.replace(/\b(reversed|reverse|rev|inverted|upside down|rx|r)\b\s*$/,function(){rev=true;return""}).trim();
  s=s.replace(/^\s*(reversed|rev)\b/,function(){rev=true;return""}).trim();
  if(!s)return null;
  var bare=s.replace(/^the /,"");
  for(i=0;i<22;i++){
    var w=norm(MAJORS[i][0]).replace(/^the /,""), t=norm(MAJORS[i][1]).replace(/^the /,"");
    if(bare===w||bare===t||s===norm(MAJORS[i][0])||s===norm(MAJORS[i][1]))return{card:majorCard(i),rev:rev};
  }
  var ALIAS=[
    [0,["six guns","sixguns","six gun","wands","wand","staves","staffs","rods","batons","clubs"]],
    [1,["springs","spring","cups","cup","chalices","hearts","vessels"]],
    [2,["rails","rail","swords","sword","blades","spades"]],
    [3,["claims","claim","pentacles","pentacle","coins","coin","disks","discs","diamonds"]]
  ];
  var si=-1,rest=null;
  for(var a=0;a<ALIAS.length;a++)for(var b=0;b<ALIAS[a][1].length;b++){
    var nm=ALIAS[a][1][b];
    if(s===nm||s.endsWith(" "+nm)){si=ALIAS[a][0];rest=s.slice(0,s.length-nm.length).replace(/\bof\s*$/,"").trim()}
  }
  if(si>=0&&rest){
    var first=rest.split(" ")[0];
    var rw=NUMWORD[first]||NUMWORD[parseInt(first)]||null;
    if(rw)return{card:minorCard(si,RANKS.indexOf(rw)),rev:rev};
  }
  return null;
}
function searchCards(q){
  var n=norm(q); if(!n)return[];
  return fullDeck().filter(function(c){return norm(c.west).indexOf(n)>=0||norm(c.trad).indexOf(n)>=0}).slice(0,8);
}

/* ============ MEANING & PROMPT ============ */
function meaningFor(card,rev){
  var core=rev?card.rv:card.up;
  if(card.t==="major")return core;
  return core;
}
function suitLine(card){
  return SUITS[card.s][0]+" ("+SUITS[card.s][1]+") — "+SUITS[card.s][2]+".";
}
function scaleFor(card){
  if(card.t==="major")return "Big Sky. This sets the chapter's large question.";
  if(card.r>=10)return "Court card. Someone enters. Give them a name.";
  if(card.r<=2)return "Small — a detail, a rumor, background color.";
  if(card.r<=6)return "Middling — a real complication that changes something already on the page.";
  return "Large — a crisis that forces a hard choice or a loss.";
}
function promptFor(card,lens){
  if(card.t==="major"){
    var ov=J("lr.override."+lens.id,{});
    return ov[card.i]||lens.p[card.i];
  }
  var domain=lens.suits[card.s];
  if(card.r>=10) return card.q+" In this lens: "+lens.courts[card.r-10]+".";
  return card.q+" Read it through "+domain.toLowerCase()+".";
}
/* short auto-title suggestion */
function suggestTitle(card,rev){
  if(card.t==="major")return card.west;
  return card.west;
}
</script>
<script>
/* ============ IN-APP DIALOGS ============
   Native confirm()/prompt() are disabled in Android WebView wrappers,
   so every destructive or renaming action uses these instead. */
var DLG=null;
function dlgNodeRemove(){var e=document.getElementById("dlg");if(e)e.remove()}
function dlgClose(){DLG=null;dlgNodeRemove()}
function dlgShow(html){
  dlgNodeRemove();
  var d=document.createElement("div");
  d.id="dlg"; d.className="dlg-wrap";
  d.innerHTML='<div class="dlg" role="dialog" aria-modal="true">'+html+'</div>';
  document.body.appendChild(d);
  d.addEventListener("click",function(ev){if(ev.target===d)dlgClose()});
}
function uiConfirm(msg,onYes,yesLabel){
  dlgShow('<p class="dlg-m">'+esc(msg)+'</p><div class="row spread">'+
    '<button class="btn ghost" onclick="dlgClose()">Cancel</button>'+
    '<button class="btn primary" onclick="dlgYes()">'+esc(yesLabel||"Yes, do it")+'</button></div>');
  DLG={onYes:onYes};
}
function dlgYes(){var f=DLG&&DLG.onYes;dlgClose();if(f)f()}
function uiPrompt(msg,val,onOk,okLabel){
  dlgShow('<p class="dlg-m">'+esc(msg)+'</p>'+
    '<input type="text" id="dlgin" value="'+esc(val||"")+'">'+
    '<div class="row spread" style="margin-top:14px">'+
    '<button class="btn ghost" onclick="dlgClose()">Cancel</button>'+
    '<button class="btn primary" onclick="dlgOk()">'+esc(okLabel||"Save")+'</button></div>');
  DLG={onOk:onOk};
  var i=document.getElementById("dlgin");
  if(i){i.focus();i.select();i.onkeydown=function(e){if(e.key==="Enter"){e.preventDefault();dlgOk()}}}
}
function dlgOk(){
  var i=document.getElementById("dlgin"), v=i?i.value:"";
  var f=DLG&&DLG.onOk; dlgClose(); if(f)f(v);
}
</script>
<script>
var K_SESS="lr.session", K_ARCH="lr.archive", K_GRIM="lr.grimoire", K_REG="lr.register", K_LENS="lr.customlenses";
var S=null, ZOOM=null, SUG=[], SUGI=-1, BRIEF=false;
var app=function(){return document.getElementById("app")};
function setMeta(t){document.getElementById("topmeta").textContent=t||""}
function allLenses(){return LENSES.concat(J(K_LENS,[]))}
function lensById(id){var a=allLenses(),i;for(i=0;i<a.length;i++)if(a[i].id===id)return a[i];return null}
function save(){if(S)SJ(K_SESS,S)}
function toast(m){var t=document.getElementById("toast");t.textContent=m;t.classList.remove("hidden");
  clearTimeout(t._h);t._h=setTimeout(function(){t.classList.add("hidden")},2200)}
function esc(s){return (s||"").replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function newSession(lensId,o){
  return{id:"s"+Date.now(),lens:lensId,title:o.title||"",mode:o.mode,rev:o.rev,scale:o.scale,
    started:new Date().toISOString(),chapter:1,drawn:[],entries:[],pending:null}
}
function remaining(){var u={};S.drawn.forEach(function(k){u[k]=1});
  return fullDeck().filter(function(c){return !u[cardKey(c)]})}
function drawRandom(majorsOnly){
  var pool=remaining();
  if(majorsOnly)pool=pool.filter(function(c){return c.t==="major"});
  if(!pool.length)return null;
  var c=pool[Math.floor(Math.random()*pool.length)];
  return{card:c,rev:S.rev?Math.random()<0.5:false};
}
function autogrow(el){if(!el)return;el.style.height="auto";el.style.height=Math.max(el.scrollHeight+4,160)+"px"}
function bindGrow(id){var e=document.getElementById(id);if(!e)return;autogrow(e);e.oninput=function(){autogrow(e)}}

/* ---------- HOME ---------- */
function renderHome(){
  setMeta("");
  var resume=J(K_SESS,null), arch=J(K_ARCH,[]);
  var h='<h1>Pick a lens.</h1><p class="lede">One deck, one engine. The lens decides what you\'re building and how every card is read.</p>';
  if(resume){var l=lensById(resume.lens);
    h+='<div class="deckbox"><h4>Session in progress</h4><p class="small dim" style="margin:0 0 12px">'+
    esc(resume.title||"Untitled")+' — '+esc(l?l.name:resume.lens)+', chapter '+resume.chapter+', '+
    resume.entries.length+' card'+(resume.entries.length===1?"":"s")+' logged.</p><div class="row">'+
    '<button class="btn primary" onclick="resumeSession()">Resume</button>'+
    '<button class="btn" onclick="resumeSession(1)">Finish and log it</button>'+
    '<button class="btn ghost" onclick="discardSession()">Discard</button></div></div>';}
  h+='<div class="lens-grid">'+allLenses().map(function(l){
    return '<button class="lens" onclick="renderSetup(\''+l.id+'\')"><div class="ln">'+esc(l.name)+
    '</div><div class="lscope">'+esc(l.scope)+'</div><div class="ldesc">'+esc(l.desc)+'</div></button>'}).join("")+'</div>';
  h+='<div class="row" style="margin-top:26px">'+
    '<button class="btn" onclick="renderRegister()">Register'+(J(K_REG,[]).length?" ("+J(K_REG,[]).length+")":"")+'</button>'+
    '<button class="btn" onclick="renderTables()">Tables &amp; engines</button>'+
    '<button class="btn" onclick="renderGrimoire()">Grimoire</button>'+
    '<button class="btn" onclick="renderArchive()">Past sessions'+(arch.length?" ("+arch.length+")":"")+'</button>'+
    '<button class="btn" onclick="renderLensBuilder()">Build a lens</button></div>';
  app().innerHTML=h;
}
function discardSession(){uiConfirm("Discard the session in progress? This cannot be undone.",
  function(){DB.del(K_SESS);S=null;renderHome()},"Discard it")}
function resumeSession(fin){S=J(K_SESS,null);if(!S)return renderHome();if(fin)finishSession();else renderPlay()}

/* ---------- SETUP ---------- */
function renderSetup(id){
  var l=lensById(id); if(!l)return renderHome();
  setMeta(l.name);
  app().innerHTML='<button class="btn ghost" onclick="renderHome()">← All lenses</button>'+
  '<h1>'+esc(l.name)+'</h1><p class="lede">'+esc(l.desc)+'</p>'+
  lensBriefHTML(l,true)+
  '<h3>Set up the session</h3>'+
  '<label class="fld" for="ttl">Name this session</label>'+
  '<input type="text" id="ttl" placeholder="e.g. The Pit, Baron Vance, Wolf Creek">'+
  '<p class="small dim" style="margin:6px 0 0">You can rename it any time.</p><div style="height:18px"></div>'+
  '<label class="fld">How do you draw?</label><div class="row" id="modeRow">'+
  '<button class="btn" data-v="random" onclick="pick(\'modeRow\',this)">The app draws</button>'+
  '<button class="btn primary" data-v="physical" onclick="pick(\'modeRow\',this)">I type my own cards</button></div>'+
  '<div style="height:18px"></div><label class="fld">Reversed cards</label><div class="row" id="revRow">'+
  '<button class="btn primary" data-v="1" onclick="pick(\'revRow\',this)">Use reversals</button>'+
  '<button class="btn" data-v="0" onclick="pick(\'revRow\',this)">Upright only</button></div>'+
  '<div style="height:18px"></div><label class="fld" for="areaSel">Area — biases race rolls on the tables</label>'+
  '<select id="areaSel">'+AREAS.map(function(a){return '<option value="'+a.id+'"'+(curArea()===a.id?" selected":"")+'>'+esc(a.n)+'</option>'}).join("")+'</select>'+
  '<div style="height:18px"></div><label class="fld">How long?</label>'+
  '<div class="scale-opts" id="sclRow">'+
  '<button class="scale-opt" data-v="quick" onclick="pick2(\'sclRow\',this)"><b>Quick draw</b>'+
    '<span>Three cards: '+l.quick.map(esc).join(" · ")+'</span></button>'+
  '<button class="scale-opt sel" data-v="short" onclick="pick2(\'sclRow\',this)"><b>Short ride</b>'+
    '<span>One chapter. Draw until the story of it feels told — usually four to eight cards.</span></button>'+
  '<button class="scale-opt" data-v="full" onclick="pick2(\'sclRow\',this)"><b>Full ride</b>'+
    '<span>Five chapters, following the arc below. The long version.</span></button></div>'+
  '<div class="deckbox" style="margin-top:20px"><h4>The five-chapter arc</h4>'+
  CHAPTERS.map(function(c,i){return '<div class="arcrow"><span class="arcnum">'+(i+1)+'</span><div>'+
    '<b>'+esc(c[0])+'</b><br><span class="small dim">'+esc(c[1])+'</span></div></div>'}).join("")+'</div>'+
  '<hr class="rule"><button class="btn primary" onclick="startSession(\''+l.id+'\')">Start the session</button>';
}
function pick(rowId,btn){var n=document.querySelectorAll("#"+rowId+" .btn");
  for(var i=0;i<n.length;i++)n[i].classList.remove("primary");btn.classList.add("primary")}
function picked(rowId){var b=document.querySelector("#"+rowId+" .btn.primary");return b?b.dataset.v:null}
function pick2(rowId,btn){var n=document.querySelectorAll("#"+rowId+" .scale-opt");
  for(var i=0;i<n.length;i++)n[i].classList.remove("sel");btn.classList.add("sel")}
function picked2(rowId){var b=document.querySelector("#"+rowId+" .scale-opt.sel");return b?b.dataset.v:"short"}
function startSession(id){
  S=newSession(id,{title:document.getElementById("ttl").value.trim(),mode:picked("modeRow"),
    rev:picked("revRow")==="1",scale:picked2("sclRow")});
  var ae=document.getElementById("areaSel"); S.area=ae?ae.value:"none"; DB.set(K_AREA,S.area);

}

/* ---------- LENS BRIEF ---------- */
function lensBriefHTML(l,open){
  return '<div class="brief'+(open?"":" closed")+'" id="briefBox">'+
  '<div class="brief-h"><b>How '+esc(l.name)+' works</b>'+
  (open?'':'<button class="btn sm ghost" onclick="BRIEF=!BRIEF;renderPlay()">Hide</button>')+'</div>'+
  '<p class="small"><span class="klbl">You end up with</span> '+esc(l.artifact)+'</p>'+
  '<p class="small"><span class="klbl">Every card answers</span> '+esc(l.frame||"What does this reveal?")+'</p>'+
  '<div class="suitgrid">'+l.suits.map(function(s,i){

    '<span class="small dim">'+esc(s)+'</span></div>'}).join("")+'</div>'+
  '<div class="suitgrid">'+l.courts.map(function(c,i){

  '<p class="small klbl" style="margin:12px 0 4px">Which deck to use</p><ul class="brieful">'+
  l.deck.map(function(d){return "<li>"+esc(d)+"</li>"}).join("")+'</ul></div>';
}

/* ---------- PLAY ---------- */
function renderPlay(){
  EDITING=null;
  var l=lensById(S.lens); setMeta(l.name);
  var n=S.entries.length, q=S.scale==="quick";
  var h='<div class="sesshead">'+
    '<div class="sesstitle" onclick="renameSession()">'+esc(S.title||"Untitled session")+
    ' <span class="pencil">edit</span></div>'+
    '<div class="sessmeta">'+esc(l.name)+' · '+esc(l.scope)+' · '+
    (S.mode==="random"?"app draws":"you type")+(S.rev?" · reversals on":"")+'</div></div>';

  /* framework strip */
  if(q){
    h+='<div class="frame"><div class="frame-h">Quick draw — three positions</div><div class="steps">'+
      l.quick.map(function(p,i){return '<div class="step'+(i<n?" done":(i===n?" now":""))+'">'+
      '<span class="sn">'+(i+1)+'</span><span>'+esc(p)+'</span></div>'}).join("")+'</div></div>';
  } else if(S.scale==="full"){
    h+='<div class="frame"><div class="frame-h">Chapter '+S.chapter+' of 5 — '+esc(CHAPTERS[S.chapter-1][0])+'</div>'+

      '<p class="small dim" style="margin:10px 0 0">'+esc(CHAPTERS[S.chapter-1][1])+'</p>'+
      '<p class="small dim" style="margin:6px 0 0">Open the chapter with a Big Sky card, then fill it in with Frontier cards until it feels told. '+n+' logged so far.</p></div>';
  } else {
    h+='<div class="frame"><div class="frame-h">Short ride — one chapter</div>'+
      '<p class="small dim" style="margin:0">Open with a Big Sky card for the large question, then draw Frontier cards for detail. Four to eight cards is a full chapter. '+n+' logged so far.</p></div>';
  }

  h+='<div class="row" style="margin:14px 0"><button class="btn sm ghost" onclick="BRIEF=!BRIEF;renderPlay()">'+
    (BRIEF?"Hide":"Show")+' how '+esc(l.name)+' works</button></div>';
  if(BRIEF)h+=lensBriefHTML(l,false);

  if(S.pending) h+=cardStageHTML(S.pending,l);
  else if(q&&n>=3) h+='<div class="frame"><div class="frame-h">That\'s the spread</div>'+
    '<p class="small dim" style="margin:0">Three cards, three answers. Finish below and take the log.</p></div>';
  else h+=drawControlsHTML();

  if(S.entries.length) h+='<hr class="rule"><h2>This session</h2>'+
    S.entries.map(function(e,i){return entryHTML(e,i,true)}).join("");

  h+='<hr class="rule"><div class="row spread">'+
    '<div class="row">'+(S.scale==="full"&&S.chapter<5?'<button class="btn" onclick="nextChapter()">End chapter '+S.chapter+'</button>':"")+
    '<button class="btn" onclick="renderRegister()">Register</button>'+
    '<button class="btn" onclick="renderTables()">Tables</button>'+
    '<button class="btn" onclick="renderHistory()">Rolls'+(histAll().length?" ("+histAll().length+")":"")+'</button></div>'+
    '<div class="row"><button class="btn primary" onclick="finishSession()">Finish &amp; log</button>'+

<script>
/* ============ TABLE STORE (editable overlay) ============ */
var K_TBL="lr.tables.edits", K_ENG="lr.engines.custom", K_AREA="lr.area", K_RHIST="lr.rollhist";
function tblAll(){
  var edits=J(K_TBL,{}), out=[];
  for(var i=0;i<TABLES.length;i++){
    var t=TABLES[i];
    out.push(edits[t.id]?edits[t.id]:t);
  }
  for(var k in edits){ if(!edits[k]._base) { var found=false;
    for(var j=0;j<TABLES.length;j++) if(TABLES[j].id===k) found=true;
    if(!found) out.push(edits[k]); } }
  return out;
}
function tbl(id){
  var e=J(K_TBL,{}); if(e[id])return e[id];
  for(var i=0;i<TABLES.length;i++) if(TABLES[i].id===id) return TABLES[i];
  return null;
}
function tblSave(t){var e=J(K_TBL,{}); e[t.id]=t; SJ(K_TBL,e)}
function tblReset(id){var e=J(K_TBL,{}); delete e[id]; SJ(K_TBL,e)}
function tblIsEdited(id){return !!J(K_TBL,{})[id]}
function rowText(r){return r[1]}
function rowLo(r){return r[0]}
function rowHi(r){return r.length>2?r[2]:r[0]}
function dieOf(t){return parseInt((t.d||"d100").slice(1),10)}

function engAll(){return ENGINES.concat(J(K_ENG,[]))}
function engById(id){var a=engAll();for(var i=0;i<a.length;i++)if(a[i].id===id)return a[i];return null}

/* ============ DICE ============ */
function roll(n){return Math.floor(Math.random()*n)+1}
function lookup(id,n){
  var t=tbl(id); if(!t)return{id:id,n:n||0,text:"[missing table "+id+"]",table:id};
  var die=dieOf(t); var v=(n&&n>=1&&n<=die)?n:roll(die);
  for(var i=0;i<t.r.length;i++){
    if(v>=rowLo(t.r[i])&&v<=rowHi(t.r[i]))
      return{table:id,tname:t.n,n:v,die:die,text:rowText(t.r[i])};
  }
  return{table:id,tname:t.n,n:v,die:die,text:"[no row for "+v+"]"};
}

/* ============ AREA-WEIGHTED RACE ============ */
function areaById(id){for(var i=0;i<AREAS.length;i++)if(AREAS[i].id===id)return AREAS[i];return AREAS[0]}
function curArea(){return (S&&S.area)?S.area:(DB.get(K_AREA)||"none")}
function rollRace(areaId){
  var a=areaById(areaId||curArea()), v=roll(100);
  if(a.human&&v<=a.human) return{table:"1",tname:"Race",n:v,die:100,text:"Human",area:a.n};
  for(var i=0;i<(a.sec||[]).length;i++){
    var s=a.sec[i];
    if(v>=s[0]&&v<=s[1]){
      var pick=s[2][Math.floor(Math.random()*s[2].length)];
      return{table:"1",tname:"Race",n:v,die:100,text:pick,area:a.n};
    }
  }
  var base=lookup("1",v); base.area=a.n; return base;
}
function isElvenTied(race){
  return /half-elf|elven-blooded/i.test(race||"");
}

/* ============ NAMES ============ */
function rollName(race,gender){
  var elven=isElvenTied(race), parts=[], detail=[];
  if(elven){
    var anom=/anomaly/i.test(race);
    var f=lookup(anom?"O2_Elven_Blooded_Anomaly_First_Name":"O2_Half_Elf_First_Name");
    var s=lookup(anom?"O2_Elven_Blooded_Anomaly_Surname_Epithet":"O2_Half_Elf_Surname_Epithet");
    parts=[f.text,s.text]; detail=[f,s];
  } else {
    var male=(gender==="male");
    var t=lookup(male?"O1_Title_Male_Presenting":"O1_Title_Female_Presenting");
    var fn=lookup(male?"O1_First_Name_Male":"O1_First_Name_Female");
    var sn=lookup("O1_Surname_either");
    parts=[t.text,fn.text,sn.text]; detail=[t,fn,sn];
  }
  return{table:"name",tname:"Name",text:parts.join(" ").replace(/\s+/g," ").trim(),
    parts:detail,elven:elven,gender:gender||""};
}

/* ============ BIOME -> CREATURE ============ */
var BIOMEMAP=[[/prairie|plain|grass/i,"W3"],[/desert|badland/i,"W4"],[/mountain|foothill|canyon|mesa/i,"W5"],
  [/river|lake|wetland|marsh|swamp|creek/i,"W6"],[/town|settlement|ranch|farm|homestead/i,"W7"]];
function creatureForBiome(biomeText){
  for(var i=0;i<BIOMEMAP.length;i++) if(BIOMEMAP[i][0].test(biomeText||"")) return BIOMEMAP[i][1];
  return "W2";
}

/* ============ SPECIALS ============ */
function rollWeather(){
  var base=lookup("L1"), chk=roll(10);
  if(chk>=8){var ov=lookup("L3");
    return{table:"L",tname:"Weather",text:base.text+" — and it isn't quite ordinary: "+ov.text,
      parts:[base,{table:"d10",tname:"Overlay check",n:chk,die:10,text:"overlay triggered"},ov]}}
  return{table:"L",tname:"Weather",text:base.text,
    parts:[base,{table:"d10",tname:"Overlay check",n:chk,die:10,text:"ordinary"}]};
}
function rollTownName(){
  var a=lookup("N_First_Part"), b=lookup("N_Second_Part");
  var nm=(a.text+b.text).replace(/\s+/g,"");
  var chk=roll(10), parts=[a,b,{table:"d10",tname:"Corruption check",n:chk,die:10,text:chk===1?"corrupted":"plain"}];
  var txt=nm;
  if(chk===1){var c=lookup("NC"); parts.push(c); txt=nm+" — once "+c.text}
  return{table:"N",tname:"Town name",text:txt,parts:parts};
}
function comboRoll(step){
  var parts=[],txt="";
  for(var i=0;i<step.ts.length;i++){
    var r=lookup(step.ts[i]); parts.push(r);
    txt += (i?(step.sep!=null?step.sep:""):"")+r.text;
  }
  if(step.pre)txt=step.pre+txt;
  return{table:step.ts.join("×"),tname:step.l,text:txt.replace(/\s+/g," ").trim(),parts:parts};
}

/* ============ RUN AN ENGINE STEP ============ */
function runStep(step,ctx){
  if(step.k==="roll")   return lookup(step.t);
  if(step.k==="combo")  return comboRoll(step);
  if(step.k==="race")   {var r=rollRace(); ctx.race=r.text; return r}
  if(step.k==="name")   return rollName(ctx.race,ctx.gender);
  if(step.k==="biome")  {var b=lookup("W1"); ctx.biome=b.text; return b}
  if(step.k==="creature"){var id=creatureForBiome(ctx.biome); var c=lookup(id);
                          c.tname=(tbl(id)||{}).n||id; return c}
  if(step.k==="weather")  return rollWeather();
  if(step.k==="townname") return rollTownName();
  if(step.k==="pick")   {var o=step.opts[Math.floor(Math.random()*step.opts.length)];
                         var rr=lookup(o[0]); rr.tname=o[1]; return rr}
  return{table:"?",tname:step.l,text:"[unsupported step]"};
}
function needsGender(eng){
  for(var i=0;i<eng.steps.length;i++) if(eng.steps[i].k==="name") return true;
  return false;
}
function runEngine(eng,ctx,includeOptional){
  ctx=ctx||{}; var out=[];
  for(var i=0;i<eng.steps.length;i++){
    var s=eng.steps[i];
    if(s.opt&&!includeOptional) continue;
    var r=runStep(s,ctx);
    out.push({label:s.l,step:i,res:r,opt:!!s.opt});
  }
  return out;
}
function engineToText(eng,results){
  return results.map(function(r){return r.label+": "+r.res.text}).join("\n");
}

/* ============ ROLL HISTORY (session-scoped) ============ */
function histAdd(entry){
  var h=J(K_RHIST,[]); h.unshift(entry); if(h.length>200)h.length=200; SJ(K_RHIST,h);
}
function histAll(){return J(K_RHIST,[])}
function histClear(){DB.del(K_RHIST)}
</script>
<script>
/* ============ ROLLER STATE ============ */
var RES=null;   // {engId, results:[], ctx:{}, opt:bool, target:null|"pending"|entryIndex}
var TBLQ="";

/* ---------- entry point from home ---------- */
function renderTables(){
  setMeta("Tables");
  var h='<button class="btn ghost" onclick="renderHome()">← Back</button><h1>Tables &amp; engines</h1>'+
  '<p class="lede">The Wild West Elven Kingdom tables, bundled. Roll an engine for a full result, or any single table on its own.</p>'+
  '<div class="row" style="margin-bottom:6px"><span class="klbl" style="margin:0">Area for race rolls</span></div>'+
  '<select id="areaSel" onchange="setArea(this.value)">'+AREAS.map(function(a){
    return '<option value="'+a.id+'"'+(curArea()===a.id?" selected":"")+'>'+esc(a.n)+'</option>'}).join("")+'</select>'+
  '<p class="small dim" style="margin-top:6px">Biases every Race roll to that area\'s population. You can override it on any single roll.</p>'+
  '<h2>Engines</h2><div class="eng-grid">'+engAll().map(function(e){
    return '<button class="eng" onclick="openEngine(\''+e.id+'\')"><div class="en">'+esc(e.n)+'</div>'+

  '<h2>Single tables</h2>'+
  '<input type="text" id="tq" placeholder="Filter tables…" value="'+esc(TBLQ)+'" oninput="TBLQ=this.value;renderTableList()">'+
  '<div id="tlist"></div>'+
  '<hr class="rule"><div class="row"><button class="btn" onclick="renderHistory()">Roll history'+
  (histAll().length?" ("+histAll().length+")":"")+'</button>'+
  '<button class="btn" onclick="renderNewTable()">New table</button>'+
  '<button class="btn" onclick="renderNewEngine()">New engine</button></div>';
  app().innerHTML=h; renderTableList();
}
function setArea(v){ if(S){S.area=v;save()} DB.set(K_AREA,v); toast("Area set.") }
function renderTableList(){
  var q=norm(TBLQ), list=tblAll().filter(function(t){
    return !q||norm(t.n).indexOf(q)>=0||norm(t.id).indexOf(q)>=0||norm(t.s||"").indexOf(q)>=0});
  var el=document.getElementById("tlist"); if(!el)return;
  el.innerHTML='<div class="tbl-list">'+list.map(function(t){
    return '<div class="tbl-row"><div class="tbl-info"><b>'+esc(t.id)+'</b> · '+esc(t.n)+
    (tblIsEdited(t.id)?' <span class="tag">edited</span>':'')+
    '<br><span class="small dim">'+t.r.length+' entries · '+esc(t.d)+(t.s&&t.s!==t.n?' · '+esc(t.s):'')+'</span></div>'+
    '<div class="row"><button class="btn sm" onclick="rollSingle(\''+t.id+'\')">Roll</button>'+
    '<button class="btn sm ghost" onclick="editTable(\''+t.id+'\')">Edit</button></div></div>'}).join("")+'</div>';
}

/* ---------- rolling a single table ---------- */
function rollSingle(id,target){
  var t=tbl(id); if(!t)return;
  var r=lookup(id);
  RES={engId:null,single:id,results:[{label:t.n,step:0,res:r}],ctx:{},opt:false,target:target||null};
  histAdd({when:new Date().toISOString(),what:t.n,text:r.text,detail:[t.id+" "+r.n+": "+r.text]});
  renderResult();
}

/* ---------- engines ---------- */
function openEngine(id,target){
  var e=engById(id); if(!e)return;
  if(needsGender(e)){ askGender(id,target); return }
  doEngine(id,{},target);
}
function askGender(id,target){
  var e=engById(id);
  app().innerHTML='<button class="btn ghost" onclick="'+(target?"renderPlay()":"renderTables()")+'">← Back</button>'+
  '<h1>'+esc(e.n)+'</h1><p class="lede">This engine rolls a name. Which name banks should it use?</p>'+
  '<div class="scale-opts">'+
  '<button class="scale-opt" onclick="doEngine(\''+id+'\',{gender:\'male\'},'+(target?"'"+target+"'":"null")+')"><b>Male-presenting</b><span>Title and first name from the male banks.</span></button>'+
  '<button class="scale-opt" onclick="doEngine(\''+id+'\',{gender:\'female\'},'+(target?"'"+target+"'":"null")+')"><b>Female-presenting</b><span>Title and first name from the female banks.</span></button>'+
  '<button class="scale-opt" onclick="doEngine(\''+id+'\',{gender:(Math.random()<0.5?\'male\':\'female\')},'+(target?"'"+target+"'":"null")+')"><b>Let the dice decide</b><span>Coin flip, then roll.</span></button>'+
  '</div><p class="small dim" style="margin-top:14px">Elven-tied races use the Italian banks regardless — those aren\'t gendered separately.</p>';
}
function doEngine(id,ctx,target){
  var e=engById(id);
  var results=runEngine(e,ctx,true);
  RES={engId:id,results:results,ctx:ctx,opt:true,target:target||null};
  logRoll();
  renderResult();
}
function logRoll(){
  var e=RES.engId?engById(RES.engId):null;
  histAdd({when:new Date().toISOString(),what:e?e.n:(RES.results[0]||{}).label||"Roll",
    text:RES.results.map(function(r){return r.res.text}).join(" / "),
    detail:RES.results.map(function(r){return r.label+" ["+r.res.table+
      (r.res.n?" "+r.res.n:"")+"]: "+r.res.text})});
}
function rerollStep(i){
  var e=RES.engId?engById(RES.engId):null;
  if(e){ var s=e.steps[RES.results[i].step]; RES.results[i].res=runStep(s,RES.ctx) }
  else { RES.results[i].res=lookup(RES.single) }
  renderResult();
}
function rerollAll(){
  if(RES.engId)doEngine(RES.engId,RES.ctx,RES.target);
  else rollSingle(RES.single,RES.target);
}
function toggleOptional(){
  RES.opt=!RES.opt;
  if(RES.engId){var e=engById(RES.engId);
    RES.results=runEngine(e,RES.ctx,RES.opt)}
  renderResult();
}
function renderResult(){
  ensureSel();
  var e=RES.engId?engById(RES.engId):null;
  var title=e?e.n:(tbl(RES.single)||{}).n||"Roll";
  var back=RES.target?'<button class="btn ghost" onclick="RES=null;renderPlay()">← Back to the session</button>'
                     :'<button class="btn ghost" onclick="RES=null;renderTables()">← All tables</button>';
  var h=back+'<h1>'+esc(title)+'</h1>'+(e?'<p class="lede">'+esc(e.use)+'</p>':'');
  h+='<div class="res-list">'+RES.results.map(function(r,i){
    var det=(r.res.parts||[]).map(function(p){return esc(p.tname||p.table)+" "+(p.n||"")+": "+esc(p.text)}).join(" · ");
    return '<div class="res'+(r.opt?" opt":"")+'"><div class="res-l">'+esc(r.label)+
    '<span class="res-src">'+esc(r.res.table)+(r.res.n?" · "+r.res.n:"")+
    (r.res.area?" · "+esc(r.res.area):"")+'</span></div>'+
    '<div class="res-t">'+esc(r.res.text)+'</div>'+
    (det?'<div class="res-d">'+det+'</div>':'')+
    '<button class="btn sm ghost noprint" onclick="rerollStep('+i+')">Reroll this</button></div>'}).join("")+'</div>';
  h+='<div class="row" style="margin-top:16px"><button class="btn" onclick="rerollAll()">Reroll everything</button>'+
     (e&&e.steps.some(function(s){return s.opt})?'<button class="btn ghost" onclick="toggleOptional()">'+
       (RES.opt?"Hide optional steps":"Include optional steps")+'</button>':'')+'</div>';
  h+='<hr class="rule">';
  if(RES.target){
    h+=pasteBoxHTML();
  } else {
    h+='<div class="row"><button class="btn" onclick="copyResult()">Copy</button>'+
       '<button class="btn ghost" onclick="renderHistory()">Roll history</button></div>';
  }
  app().innerHTML=h;
}

/* ---------- choose what to paste, and where ---------- */
var PICK={dest:"text",mode:"append",sel:null,labels:true};
