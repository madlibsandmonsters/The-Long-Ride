<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1119">
<title>The Long Ride</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --ink:#0E1119; --ink-2:#161B27; --ink-3:#1F2634;
  --bone:#E9E3D5; --bone-dim:#A9A290;
  --brass:#C9922F; --verdigris:#6E9285; --rust:#94433A;
  --rule:#2C3444;
  --serif:"Hoefler Text","Baskerville","Palatino Linotype",Palatino,Georgia,serif;
  --sans:"Avenir Next","Segoe UI",Roboto,system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--ink);color:var(--bone);font-family:var(--serif);font-size:17px;line-height:1.6}
body{padding-bottom:env(safe-area-inset-bottom)}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.wrap{max-width:760px;margin:0 auto;padding:0 20px 96px}
header.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  padding:20px 0 14px;border-bottom:1px solid var(--rule);margin-bottom:26px;flex-wrap:wrap}
.brand{font-size:23px;letter-spacing:.02em;font-weight:600}
.brand em{font-style:normal;color:var(--brass)}
.top-meta{font-family:var(--sans);font-size:13px;color:var(--bone-dim)}

h1{font-size:40px;line-height:1.12;font-weight:600;margin:0 0 10px}
h2{font-size:25px;font-weight:600;margin:36px 0 12px}
h3{font-size:19px;font-weight:600;margin:22px 0 8px}
p{margin:0 0 14px;max-width:66ch}
.lede{color:var(--bone-dim);max-width:60ch}
.sans{font-family:var(--sans)}
.dim{color:var(--bone-dim)}
.small{font-size:14px}

.btn{background:transparent;border:1px solid var(--rule);color:var(--bone);
  padding:11px 18px;border-radius:2px;cursor:pointer;font-family:var(--sans);font-size:15px}
.btn:hover{border-color:var(--brass);color:var(--brass)}
.btn.primary{background:var(--brass);border-color:var(--brass);color:#15100A;font-weight:600}
.btn.primary:hover{background:#DBA33D;color:#15100A}
.btn.ghost{border-color:transparent;color:var(--bone-dim);padding-left:0}
.btn.ghost:hover{color:var(--brass)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.sm{padding:7px 12px;font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{justify-content:space-between}

input[type=text],textarea,select{width:100%;background:var(--ink-2);border:1px solid var(--rule);
  border-radius:2px;padding:11px 13px;font-family:var(--sans);font-size:15px}
textarea{font-family:var(--serif);font-size:17px;line-height:1.7;min-height:200px;resize:vertical;overflow:hidden}
input[type=text]{font-size:16px}
@media (max-width:520px){textarea{min-height:44vh;font-size:17px}input[type=text],select{font-size:16px}}
label.fld{display:block;font-family:var(--sans);font-size:13px;color:var(--bone-dim);margin:0 0 6px}

/* lens picker */
.lens-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule)}
.lens{background:var(--ink);padding:16px 17px;text-align:left;cursor:pointer;border:0;display:block;width:100%}
.lens:hover{background:var(--ink-2)}
.lens[aria-pressed=true]{background:var(--ink-3);box-shadow:inset 3px 0 0 var(--brass)}
.lens .ln{font-size:19px;font-weight:600;margin-bottom:2px}
.lens .lscope{font-family:var(--sans);font-size:12.5px;color:var(--brass)}
.lens .ldesc{font-family:var(--sans);font-size:13px;color:var(--bone-dim);margin-top:7px;line-height:1.45}

/* deck guidance */
.deckbox{border:1px solid var(--rule);border-left:3px solid var(--verdigris);padding:15px 18px;margin:22px 0;background:var(--ink-2)}
.deckbox h4{margin:0 0 8px;font-size:16px;font-weight:600;color:var(--verdigris)}
.deckbox ul{margin:0;padding-left:19px;font-family:var(--sans);font-size:14.5px;line-height:1.6}
.deckbox li{margin-bottom:5px}

/* the drawn card — the hero */
.card-stage{border:1px solid var(--rule);background:linear-gradient(180deg,var(--ink-2),var(--ink));padding:30px 26px;margin:22px 0;position:relative}
.card-stage.rev{border-color:var(--rust)}
.card-arcana{font-family:var(--sans);font-size:12.5px;color:var(--bone-dim);margin-bottom:9px}
.card-name{font-size:36px;line-height:1.1;font-weight:600;margin:0 0 4px}
.card-stage.rev .card-name{color:var(--rust)}
.card-trad{font-family:var(--sans);font-size:14px;color:var(--bone-dim);margin-bottom:16px}
.card-orient{display:inline-block;font-family:var(--sans);font-size:12px;letter-spacing:.06em;
  border:1px solid var(--rule);padding:3px 9px;border-radius:2px;color:var(--bone-dim);margin-bottom:16px}
.card-stage.rev .card-orient{border-color:var(--rust);color:var(--rust)}
.meaning{border-top:1px solid var(--rule);padding-top:15px;margin-top:4px}
.meaning .lbl{font-family:var(--sans);font-size:12.5px;color:var(--bone-dim);margin-bottom:4px}
.prompt{font-size:21px;line-height:1.45;color:var(--brass);margin:0 0 16px;max-width:60ch}
.reminder{font-family:var(--sans);font-size:14.5px;color:var(--bone-dim);line-height:1.55;max-width:66ch}

.chapline{font-family:var(--sans);font-size:13px;color:var(--bone-dim);
  display:flex;gap:14px;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid var(--rule);margin-bottom:6px}
.chapline b{color:var(--bone);font-weight:600}

/* log entries */
.entry{border-left:2px solid var(--rule);padding:2px 0 2px 16px;margin:0 0 20px}
.entry.rev{border-left-color:var(--rust)}
.entry .ehead{font-size:19px;font-weight:600}
.entry .emeta{font-family:var(--sans);font-size:12.5px;color:var(--bone-dim);margin-bottom:6px}
.entry .eprompt{color:var(--brass);font-size:16px;margin-bottom:6px}
.entry .etext{white-space:pre-wrap}
.entry.nested{margin-left:22px;border-left-style:dashed}

/* named register */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--rule);border-radius:2px;padding:6px 11px;font-family:var(--sans);font-size:13.5px;
  background:var(--ink-2);cursor:pointer}
.chip:hover{border-color:var(--brass);color:var(--brass)}
.chip .k{color:var(--bone-dim);font-size:11.5px}


/* ---- session header ---- */
.sesshead{margin:4px 0 18px}
.sesstitle{font-size:29px;font-weight:600;line-height:1.15;cursor:pointer;display:inline-block}
.sesstitle:hover .pencil{color:var(--brass)}
.pencil{font-family:var(--sans);font-size:12px;color:var(--rule);vertical-align:middle;
  border:1px solid var(--rule);padding:2px 7px;border-radius:2px;margin-left:8px}
.sessmeta{font-family:var(--sans);font-size:13px;color:var(--bone-dim);margin-top:4px}

/* ---- framework strip ---- */
.frame{border:1px solid var(--rule);border-top:3px solid var(--verdigris);background:var(--ink-2);
  padding:15px 17px;margin:14px 0}
.frame-h{font-family:var(--sans);font-size:13px;letter-spacing:.04em;color:var(--verdigris);margin-bottom:11px}
.steps{display:flex;flex-wrap:wrap;gap:7px}
.step{display:flex;align-items:center;gap:7px;border:1px solid var(--rule);padding:5px 10px;border-radius:2px;
  font-family:var(--sans);font-size:12.5px;color:var(--bone-dim)}
.step .sn{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;
  border-radius:50%;border:1px solid var(--rule);font-size:11px}
.step.done{color:var(--bone-dim);opacity:.55}
.step.done .sn{background:var(--rule);border-color:var(--rule)}
.step.now{color:var(--brass);border-color:var(--brass)}
.step.now .sn{border-color:var(--brass);color:var(--brass)}

/* ---- lens brief ---- */
.brief{border:1px solid var(--rule);background:var(--ink-2);padding:16px 18px;margin:16px 0}
.brief-h{display:flex;justify-content:space-between;align-items:center;gap:12px;
  font-size:18px;margin-bottom:12px;border-bottom:1px solid var(--rule);padding-bottom:9px}
.klbl{font-family:var(--sans);font-size:11.5px;letter-spacing:.05em;color:var(--verdigris);
  display:block;margin-bottom:3px}
.brief p{margin:0 0 10px}
.suitgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;
  background:var(--rule);border:1px solid var(--rule);margin:12px 0}
.suitcell{background:var(--ink);padding:10px 12px;font-family:var(--sans);font-size:13.5px;line-height:1.45}
.brieful{margin:0;padding-left:19px;font-family:var(--sans);font-size:14px;line-height:1.6}
.brieful li{margin-bottom:5px}

/* ---- scale picker ---- */
.scale-opts{display:grid;gap:1px;background:var(--rule);border:1px solid var(--rule)}
.scale-opt{background:var(--ink);border:0;text-align:left;padding:14px 16px;cursor:pointer;
  display:block;width:100%;color:var(--bone)}
.scale-opt b{font-size:17px;font-weight:600;display:block;margin-bottom:3px}
.scale-opt span{font-family:var(--sans);font-size:13.5px;color:var(--bone-dim);line-height:1.45}
.scale-opt:hover{background:var(--ink-2)}
.scale-opt.sel{background:var(--ink-3);box-shadow:inset 3px 0 0 var(--brass)}
.scale-opt.sel b{color:var(--brass)}

/* ---- chapter arc list ---- */
.arcrow{display:flex;gap:12px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--rule)}
.arcrow:last-child{border-bottom:0}
.arcnum{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;
  border:1px solid var(--verdigris);color:var(--verdigris);border-radius:50%;
  font-family:var(--sans);font-size:12px;flex-shrink:0}
.arcrow b{font-size:16px}

hr.rule{border:0;border-top:1px solid var(--rule);margin:30px 0}
.hidden{display:none!important}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:var(--ink-3);
  border:1px solid var(--brass);color:var(--bone);padding:11px 18px;font-family:var(--sans);font-size:14px;z-index:50}
.suggest{border:1px solid var(--rule);border-top:0;background:var(--ink-2);max-height:210px;overflow:auto}
.suggest button{display:block;width:100%;text-align:left;background:transparent;border:0;padding:9px 13px;
  cursor:pointer;font-family:var(--sans);font-size:14.5px}
.suggest button:hover,.suggest button.sel{background:var(--ink-3);color:var(--brass)}
@media print{body{background:#fff;color:#000}.noprint{display:none!important}
  .entry{border-left:2px solid #999}.prompt,.eprompt{color:#6b4d10}}
@media (max-width:520px){h1{font-size:31px}.card-name{font-size:29px}.prompt{font-size:19px}}
</style>
</head>
<body>
<div class="wrap">
<header class="top">
  <div class="brand">The Long <em>Ride</em></div>
  <div class="top-meta" id="topmeta"></div>
</header>
<main id="app"></main>
</div>
<div id="toast" class="toast hidden"></div>
<script>

 ["Six-Guns","Wands","force, conflict, ambition, will, violence"],
 ["Springs","Cups","bonds, sustenance, faith, feeling, community"],
 ["Rails","Swords","law, order, knowledge, schemes, hard truth"],
 ["Claims","Pentacles","wealth, land, property, labor, what is owned or owed"]
];

[
 ["A spark of ambition; raw will; a venture begins.","A false start; a spark that never catches; drive misaimed.","What ignites here, and who lit it?"],

 ["Expansion; foresight; ships sighted coming in.","Overreach; delays; a venture that outran its supply.","What was set in motion earlier that is only now arriving?"],
 ["Homecoming; celebration; a foundation that holds.","A shaky home; a celebration cut short; unsettled ground.","What is being celebrated, and how solid is the ground under it?"],

 ["Wounded but still on watch; the last stand of a tired guard.","Paranoia; exhaustion; a guard who cannot stand down.","What has been endured, and who is still standing watch?"],
 ["Carrying far too much; a burden that bends the back.","Dropping the load; refusing the burden; handing it off.","What burden is being carried, and by whom?"],
 ["A restless messenger; eager news; a young spark.","Immature enthusiasm; bad news; a messenger not believed.","Who arrives with news or ambition, and how green are they?"],
 ["A headlong charge; daring; passion in motion.","Recklessness; running out of steam; a charge into nothing.","Who charges in without waiting, and what do they run at?"],

],
[

 ["Deep compassion; intuition; someone who feels everything.","Smothering; martyrdom; feeling used as leverage.","Which woman here understands people better than they understand themselves?"],

[

 ["The Ground","What's here before anything happens. Establish the shape of things at rest."],
 ["The Change","Something arrives or shifts. The situation stops being stable."],
 ["The Pressure","What strains it. Interests collide and the cracks start to show."],

];
</script>
<script>
var LENSES=[
{id:"wide",name:"Wide Country",scope:"General worldbuilding",
 desc:"Build a whole region — its land, its people, its history from founding to close.",

var SJ=function(k,o){DB.set(k,JSON.stringify(o))};

/* ============ CARD MODEL ============ */
function majorCard(i){return{t:"major",i:i,west:MAJORS[i][0],trad:MAJORS[i][1],theme:MAJORS[i][2],
  up:MAJORS[i][3],rv:MAJORS[i][4]}}
function minorCard(s,r){return{t:"minor",s:s,r:r,west:RANKS[r]+" of "+SUITS[s][0],trad:RANKS[r]+" of "+SUITS[s][1],
  up:MINORS[s][r][0],rv:MINORS[s][r][1],q:MINORS[s][r][2]}}
function fullDeck(){var d=[],i,s,r;for(i=0;i<22;i++)d.push(majorCard(i));
  for(s=0;s<4;s++)for(r=0;r<14;r++)d.push(minorCard(s,r));return d}
function cardKey(c){return c.t==="major"?"M"+c.i:"m"+c.s+"-"+c.r}
function isCourt(c){return c.t==="minor"&&c.r>=10}

var NUMWORD={1:"Ace",2:"Two",3:"Three",4:"Four",5:"Five",6:"Six",7:"Seven",8:"Eight",9:"Nine",10:"Ten",
  ace:"Ace",one:"Ace",two:"Two",three:"Three",four:"Four",five:"Five",six:"Six",seven:"Seven",eight:"Eight",
  nine:"Nine",ten:"Ten",page:"Page",jack:"Page",knave:"Page",knight:"Knight",queen:"Queen",king:"King"};
function norm(s){return (s||"").toLowerCase().replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim()}
function parseCard(raw){
  var s=norm(raw), rev=false, i;
  s=s.replace(/\b(reversed|reverse|rev|inverted|upside down|rx|r)\b\s*$/,function(){rev=true;return""}).trim();
  s=s.replace(/^\s*(reversed|rev)\b/,function(){rev=true;return""}).trim();
  if(!s)return null;
  var bare=s.replace(/^the /,"");
  for(i=0;i<22;i++){
    var w=norm(MAJORS[i][0]).replace(/^the /,""), t=norm(MAJORS[i][1]).replace(/^the /,"");
    if(bare===w||bare===t||s===norm(MAJORS[i][0])||s===norm(MAJORS[i][1]))return{card:majorCard(i),rev:rev};
  }
  var ALIAS=[
    [0,["six guns","sixguns","six gun","wands","wand","staves","staffs","rods","batons","clubs"]],
    [1,["springs","spring","cups","cup","chalices","hearts","vessels"]],
    [2,["rails","rail","swords","sword","blades","spades"]],
    [3,["claims","claim","pentacles","pentacle","coins","coin","disks","discs","diamonds"]]
  ];
  var si=-1,rest=null;
  for(var a=0;a<ALIAS.length;a++)for(var b=0;b<ALIAS[a][1].length;b++){
    var nm=ALIAS[a][1][b];
    if(s===nm||s.endsWith(" "+nm)){si=ALIAS[a][0];rest=s.slice(0,s.length-nm.length).replace(/\bof\s*$/,"").trim()}
  }
  if(si>=0&&rest){
    var first=rest.split(" ")[0];
    var rw=NUMWORD[first]||NUMWORD[parseInt(first)]||null;
    if(rw)return{card:minorCard(si,RANKS.indexOf(rw)),rev:rev};
  }
  return null;
}
function searchCards(q){
  var n=norm(q); if(!n)return[];
  return fullDeck().filter(function(c){return norm(c.west).indexOf(n)>=0||norm(c.trad).indexOf(n)>=0}).slice(0,8);
}

/* ============ MEANING & PROMPT ============ */
function meaningFor(card,rev){
  var core=rev?card.rv:card.up;
  if(card.t==="major")return core;
  return core;
}
function suitLine(card){
  return SUITS[card.s][0]+" ("+SUITS[card.s][1]+") — "+SUITS[card.s][2]+".";
}
function scaleFor(card){
  if(card.t==="major")return "Big Sky. This sets the chapter's large question.";
  if(card.r>=10)return "Court card. Someone enters. Give them a name.";
  if(card.r<=2)return "Small — a detail, a rumor, background color.";
  if(card.r<=6)return "Middling — a real complication that changes something already on the page.";
  return "Large — a crisis that forces a hard choice or a loss.";
}
function promptFor(card,lens){
  if(card.t==="major"){
    var ov=J("lr.override."+lens.id,{});
    return ov[card.i]||lens.p[card.i];
  }
  var domain=lens.suits[card.s];
  if(card.r>=10) return card.q+" In this lens: "+lens.courts[card.r-10]+".";
  return card.q+" Read it through "+domain.toLowerCase()+".";
}
/* short auto-title suggestion */
function suggestTitle(card,rev){
  if(card.t==="major")return card.west;
  return card.west;
}
</script>
<script>
var K_SESS="lr.session", K_ARCH="lr.archive", K_GRIM="lr.grimoire", K_REG="lr.register", K_LENS="lr.customlenses";

function toast(m){var t=document.getElementById("toast");t.textContent=m;t.classList.remove("hidden");
  clearTimeout(t._h);t._h=setTimeout(function(){t.classList.add("hidden")},2200)}

function newSession(lensId,o){
  return{id:"s"+Date.now(),lens:lensId,title:o.title||"",mode:o.mode,rev:o.rev,scale:o.scale,
    started:new Date().toISOString(),chapter:1,drawn:[],entries:[],pending:null}
}
function remaining(){var u={};S.drawn.forEach(function(k){u[k]=1});
  return fullDeck().filter(function(c){return !u[cardKey(c)]})}
function drawRandom(majorsOnly){
  var pool=remaining();

  if(!pool.length)return null;

}
function autogrow(el){if(!el)return;el.style.height="auto";el.style.height=Math.max(el.scrollHeight+4,160)+"px"}

/* ---------- HOME ---------- */
function renderHome(){

  h+='<div class="row" style="margin-top:26px">'+
    '<button class="btn" onclick="renderRegister()">Register'+(J(K_REG,[]).length?" ("+J(K_REG,[]).length+")":"")+'</button>'+

  '<button class="scale-opt" data-v="quick" onclick="pick2(\'sclRow\',this)"><b>Quick draw</b>'+

/* ---------- LENS BRIEF ---------- */
function lensBriefHTML(l,open){

  '<p class="small"><span class="klbl">You end up with</span> '+esc(l.artifact)+'</p>'+

  '<div class="suitgrid">'+l.suits.map(function(s,i){
    return '<div class="suitcell"><b>'+esc(SUITS[i][0])+'</b><span class="dim"> / '+esc(SUITS[i][1])+'</span><br>'+
    '<span class="small dim">'+esc(s)+'</span></div>'}).join("")+'</div>'+

/* ---------- PLAY ---------- */
function renderPlay(){
  var l=lensById(S.lens); setMeta(l.name);
  var n=S.entries.length, q=S.scale==="quick";
  var h='<div class="sesshead">'+
    '<div class="sesstitle" onclick="renameSession()">'+esc(S.title||"Untitled session")+

      '<span class="sn">'+(i+1)+'</span><span>'+esc(c[0])+'</span></div>'}).join("")+'</div>'+
      '<p class="small dim" style="margin:10px 0 0">'+esc(CHAPTERS[S.chapter-1][1])+'</p>'+
      '<p class="small dim" style="margin:6px 0 0">Open the chapter with a Big Sky card, then fill it in with Frontier cards until it feels told. '+n+' logged so far.</p></div>';
  } else {
    h+='<div class="frame"><div class="frame-h">Short ride — one chapter</div>'+
      '<p class="small dim" style="margin:0">Open with a Big Sky card for the large question, then draw Frontier cards for detail. Four to eight cards is a full chapter. '+n+' logged so far.</p></div>';
  }

  h+='<div class="row" style="margin:14px 0"><button class="btn sm ghost" onclick="BRIEF=!BRIEF;renderPlay()">'+
    (BRIEF?"Hide":"Show")+' how '+esc(l.name)+' works</button></div>';
  if(BRIEF)h+=lensBriefHTML(l,false);

  if(S.pending) h+=cardStageHTML(S.pending,l);
  else if(q&&n>=3) h+='<div class="frame"><div class="frame-h">That\'s the spread</div>'+
    '<p class="small dim" style="margin:0">Three cards, three answers. Finish below and take the log.</p></div>';
  else h+=drawControlsHTML();

  if(S.entries.length) h+='<hr class="rule"><h2>This session</h2>'+
    S.entries.map(function(e,i){return entryHTML(e,i,true)}).join("");

  h+='<hr class="rule"><div class="row spread">'+
    '<div class="row">'+(S.scale==="full"&&S.chapter<5?'<button class="btn" onclick="nextChapter()">End chapter '+S.chapter+'</button>':"")+
    '<button class="btn" onclick="renderRegister()">Register</button></div>'+
    '<div class="row"><button class="btn primary" onclick="finishSession()">Finish &amp; log</button>'+
    '<button class="btn ghost" onclick="renderHome()">Pause</button></div></div>';
  app().innerHTML=h;
  bindGrow("interp");

}
function renameSession(){
  var t=prompt("Name this session:",S.title||"");
  if(t!==null){S.title=t.trim();save();renderPlay()}
}
function drawControlsHTML(){
  if(S.mode==="random")
    return '<div class="row" style="margin:22px 0"><button class="btn primary" onclick="doDraw(false)">Draw a card</button>'+
      '<button class="btn" onclick="doDraw(true)">Draw a Big Sky card</button></div>'+
      '<p class="small dim">Big Sky cards are the 22 Major Arcana — they open chapters and ask the large questions. '+
      remaining().length+' cards left in the deck.</p>';
  return '<div style="margin:22px 0"><label class="fld" for="cardin">Type the card you drew</label>'+
    '<input type="text" id="cardin" autocomplete="off" autocapitalize="off" spellcheck="false" '+
    'placeholder="Three of Cups reversed — or The Fool, 7 of Wands, Knight of Springs">'+
    '<div id="sugg" class="suggest hidden"></div>'+

}
var SUG=[],SUGI=-1;
function onCardInput(e){
  var v=e.target.value, box=document.getElementById("sugg");
  var p=parseCard(v);

    ' <span class="dim">· '+esc(c.trad)+'</span></button>'}).join("");
}
function chooseSug(i){
  var inp=document.getElementById("cardin");
  var rev=/\b(reversed|rev)\b/i.test(inp.value);
  inp.value=SUG[i].west+(rev?" reversed":"");
  document.getElementById("sugg").classList.add("hidden"); submitCard();
}
function onCardKey(e){
  var box=document.getElementById("sugg");
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){
    if(!SUG.length)return; e.preventDefault();
    SUGI=(SUGI+(e.key==="ArrowDown"?1:SUG.length-1))%SUG.length;
    var ch=box.children;for(var i=0;i<ch.length;i++)ch[i].classList.toggle("sel",i===SUGI);
  } else if(e.key==="Enter"){e.preventDefault(); if(SUGI>=0)chooseSug(SUGI); else submitCard()}

function submitCard(){
  var inp=document.getElementById("cardin"), p=parseCard(inp.value);

}
function doDraw(mo){

function cardStageHTML(p,l){

    '<div class="klbl">This card, '+(p.rev?"reversed":"upright")+'</div><p class="reminder">'+esc(meaningFor(c,p.rev))+'</p>'+
    (c.t==="minor"?'<p class="reminder small dim">'+esc(suitLine(c))+'</p>':
      '<p class="reminder small dim">Theme: '+esc(c.theme)+'</p>')+

  '</div><div style="height:20px"></div>'+
  '<label class="fld" for="ttlin">Title — a short label you\'ll recognise later</label>'+

  '<div style="height:14px"></div>'+

  '<textarea id="interp" placeholder="'+(court?"Name them, then write who they are.":"Write what this means in your world.")+'">'+esc(p.text)+'</textarea>'+
  '<div class="row" style="margin-top:14px"><button class="btn primary" onclick="commitEntry()">Log this card</button>'+

}
function prevGrim(key){
  var g=J(K_GRIM,{})[key]||[];
  if(!g.length)return "";

  g.slice(-3).map(function(x){return '<p class="small dim" style="margin:6px 0"><b>'+esc(x.lens)+'</b> — '+
    esc(x.text.slice(0,180))+(x.text.length>180?"…":"")+'</p>'}).join("")+'</div>';

function commitEntry(){
  var t=document.getElementById("interp").value.trim();
  var ti=document.getElementById("ttlin").value.trim();
  if(!t){toast("Write something first — even one line.");return}
  var l=lensById(S.lens), p=S.pending;
  var e={key:p.key,card:p.card,rev:p.rev,text:t,title:ti||suggestTitle(p.card,p.rev),
    name:isCourt(p.card)?ti:"",chapter:S.chapter,at:new Date().toISOString(),
    prompt:promptFor(p.card,l),nested:[]};
  S.entries.push(e); S.drawn.push(p.key); S.pending=null;
  var g=J(K_GRIM,{}); (g[e.key]=g[e.key]||[]).push({lens:l.name,text:t,at:e.at}); SJ(K_GRIM,g);
  if(e.name){var r=J(K_REG,[]);r.push({name:e.name,lens:l.name,session:S.title||"Untitled",note:t.slice(0,240),at:e.at});SJ(K_REG,r)}
  save(); renderPlay();
}
function entryHTML(e,i,live){
  return '<div class="entry'+(e.rev?" rev":"")+'" id="e'+i+'">'+
  '<div class="ehead">'+esc(e.title||e.card.west)+'</div>'+
  '<div class="emeta">'+esc(e.card.west)+' · '+esc(e.card.trad)+' · '+(e.rev?"reversed":"upright")+
    (e.chapter&&S&&S.scale==="full"?' · chapter '+e.chapter:'')+'</div>'+
  '<div class="eprompt">'+esc(e.prompt)+'</div>'+
  '<div class="etext">'+esc(e.text)+'</div>'+
  (live?'<div class="row noprint" style="margin-top:10px">'+
    '<button class="btn sm ghost" onclick="editEntry('+i+')">Edit</button>'+
    '<button class="btn sm ghost" onclick="stakeZoom('+i+')">Zoom in</button>'+
    '<button class="btn sm ghost" onclick="delEntry('+i+')">Delete</button></div>':'')+
  (e.nested||[]).map(function(n,k){return '<div class="entry nested">'+
    '<div class="ehead">'+esc(n.title)+'</div><div class="emeta">'+esc(n.lens)+' · '+esc(n.card||"")+'</div>'+
    '<div class="etext">'+esc(n.text)+'</div>'+
    (live?'<div class="row noprint" style="margin-top:8px"><button class="btn sm ghost" onclick="editNested('+i+','+k+')">Edit</button>'+
      '<button class="btn sm ghost" onclick="delNested('+i+','+k+')">Delete</button></div>':'')+'</div>'}).join("")+
  '</div>';
}
function editEntry(i){
  var e=S.entries[i];
  app().innerHTML='<button class="btn ghost" onclick="renderPlay()">← Back to the session</button>'+
  '<h1>Edit</h1><div class="card-stage'+(e.rev?" rev":"")+'">'+
  '<div class="card-arcana">'+esc(e.card.trad)+' · '+(e.rev?"Reversed":"Upright")+'</div>'+
  '<div class="card-name">'+esc(e.card.west)+'</div>'+
  '<div class="meaning"><p class="prompt">'+esc(e.prompt)+'</p>'+
  '<p class="reminder">'+esc(meaningFor(e.card,e.rev))+'</p></div>'+
  '<div style="height:18px"></div><label class="fld" for="etitle">Title</label>'+
  '<input type="text" id="etitle" value="'+esc(e.title||"")+'">'+
  '<div style="height:14px"></div><label class="fld" for="etext">Your interpretation</label>'+
  '<textarea id="etext">'+esc(e.text)+'</textarea>'+
  '<div class="row" style="margin-top:14px"><button class="btn primary" onclick="saveEntry('+i+')">Save changes</button>'+
  '<button class="btn ghost" onclick="renderPlay()">Cancel</button></div></div>';
  bindGrow("etext");
}
function saveEntry(i){
  var e=S.entries[i];
  e.title=document.getElementById("etitle").value.trim()||e.card.west;
  var t=document.getElementById("etext").value.trim();
  if(t)e.text=t;
  if(e.name)e.name=e.title;
  save(); renderPlay(); toast("Saved.");
}
function delEntry(i){
  if(!confirm("Delete “"+(S.entries[i].title||S.entries[i].card.west)+"” from this session?"))return;
  var k=S.entries[i].key, ix=S.drawn.indexOf(k); if(ix>=0)S.drawn.splice(ix,1);
  S.entries.splice(i,1); save(); renderPlay();
}
function editNested(i,k){
  var n=S.entries[i].nested[k];
  app().innerHTML='<button class="btn ghost" onclick="renderPlay()">← Back to the session</button>'+
  '<h1>Edit sub-card</h1><div class="card-stage">'+
  '<div class="card-arcana">'+esc(n.lens)+(n.card?' · '+esc(n.card):'')+'</div>'+
  '<label class="fld" for="ntitle">Title</label>'+
  '<input type="text" id="ntitle" value="'+esc(n.title||"")+'">'+
  '<div style="height:14px"></div><label class="fld" for="ntext">Text</label>'+
  '<textarea id="ntext">'+esc(n.text)+'</textarea>'+
  '<div class="row" style="margin-top:14px">'+
  '<button class="btn primary" onclick="saveNested('+i+','+k+')">Save changes</button>'+
  '<button class="btn ghost" onclick="renderPlay()">Cancel</button></div></div>';
  bindGrow("ntext");
}
function saveNested(i,k){
  var n=S.entries[i].nested[k];
  n.title=document.getElementById("ntitle").value.trim()||n.title;
  var t=document.getElementById("ntext").value.trim();
  if(t)n.text=t;
  save(); renderPlay(); toast("Saved.");
}
function delNested(i,k){
  if(!confirm("Delete this sub-card?"))return;
  S.entries[i].nested.splice(k,1); save(); renderPlay();
}
function nextChapter(){
  if(S.chapter>=5){toast("Five chapters done. Finish and take the log.");return}
  S.chapter++; save(); renderPlay(); toast("Chapter "+S.chapter+" — "+CHAPTERS[S.chapter-1][0]);
}
</script>
<script>
/* ---------- ZOOM ---------- */
function stakeZoom(i){
  ZOOM={idx:i};
  var e=S.entries[i], subject=e.title||e.card.west;
  app().innerHTML='<button class="btn ghost" onclick="ZOOM=null;renderPlay()">← Back to the session</button>'+
  '<h1>Zoom in</h1><p class="lede">Zooming into <b>'+esc(subject)+'</b>. Pick a lens and pull a three-card spread. '+
  'It folds back into the log as a sub-card underneath.</p>'+
  '<div class="lens-grid">'+allLenses().filter(function(l){return l.id!==S.lens}).map(function(l){
    return '<button class="lens" onclick="runZoom(\''+l.id+'\')"><div class="ln">'+esc(l.name)+'</div>'+
    '<div class="lscope">'+esc(l.scope)+'</div><div class="ldesc">'+esc(l.quick.join(" · "))+'</div></button>'}).join("")+'</div>';
}
var ZC=[]; var ZOOMLENS=null;
function runZoom(lensId){
  var l=lensById(lensId), e=S.entries[ZOOM.idx], subject=e.title||e.card.west;
  ZOOMLENS=lensId; ZC=[];
  if(S.mode==="random"){
    var used={};S.drawn.forEach(function(k){used[k]=1});
    var pool=fullDeck().filter(function(c){return !used[cardKey(c)]});
    for(var k=0;k<3&&pool.length;k++){var j=Math.floor(Math.random()*pool.length);
      var c=pool.splice(j,1)[0]; ZC.push({card:c,rev:S.rev?Math.random()<0.5:false})}
  }
  var h='<button class="btn ghost" onclick="ZOOM=null;renderPlay()">← Back</button>'+
  '<h1>'+esc(l.name)+'</h1><p class="lede">On <b>'+esc(subject)+'</b>.</p>'+
  '<label class="fld" for="ztitle">Title for this sub-card</label>'+
  '<input type="text" id="ztitle" value="'+esc(l.name+" — "+subject)+'">';
  for(var k=0;k<3;k++){
    var pos=l.quick[k], z=ZC[k];
    h+='<div class="card-stage'+(z&&z.rev?" rev":"")+'"><div class="card-arcana">Position '+(k+1)+' · '+esc(pos)+'</div>';
    if(z){
      h+='<div class="card-name">'+esc(z.card.west)+'</div>'+
        '<div class="card-trad">'+esc(z.card.trad)+' · '+(z.rev?"Reversed":"Upright")+'</div>'+
        '<div class="meaning"><p class="prompt">'+esc(promptFor(z.card,l))+'</p>'+
        '<p class="reminder">'+esc(meaningFor(z.card,z.rev))+'</p></div>';
    } else {
      h+='<label class="fld" for="zc'+k+'">Card you drew</label>'+
        '<input type="text" id="zc'+k+'" placeholder="e.g. Five of Swords reversed" oninput="zcLook('+k+')">'+
        '<div id="zm'+k+'" class="meaning" style="margin-top:12px"></div>';
    }
    h+='<div style="height:14px"></div><textarea id="z'+k+'" placeholder="Your reading for this position."></textarea></div>';
  }
  h+='<button class="btn primary" onclick="saveZoom(\''+lensId+'\')">Fold this back in</button>';
  app().innerHTML=h;
  for(var m=0;m<3;m++)bindGrow("z"+m);
}
function zcLook(k){
  var v=document.getElementById("zc"+k).value, box=document.getElementById("zm"+k);
  var p=parseCard(v), l=lensById(ZOOMLENS);
  if(!p||!l){box.innerHTML="";return}
  box.innerHTML='<p class="prompt">'+esc(promptFor(p.card,l))+'</p>'+
    '<p class="reminder">'+esc(meaningFor(p.card,p.rev))+'</p>';
}
function saveZoom(lensId){
  var l=lensById(lensId), e=S.entries[ZOOM.idx], lines=[], cards=[];
  for(var k=0;k<3;k++){
    var txt=(document.getElementById("z"+k)||{}).value||"";
    var cn="";
    if(ZC[k]){cn=ZC[k].card.west+(ZC[k].rev?" (reversed)":""); S.drawn.push(cardKey(ZC[k].card))}
    else{var raw=(document.getElementById("zc"+k)||{}).value||"";var p=parseCard(raw);
      if(p){cn=p.card.west+(p.rev?" (reversed)":""); S.drawn.push(cardKey(p.card))} else cn=raw||"—"}
    if(txt.trim()){lines.push(l.quick[k]+" — "+cn+": "+txt.trim()); cards.push(cn)}
  }
  if(!lines.length){toast("Nothing written — nothing folded in.");return}
  var ti=(document.getElementById("ztitle")||{}).value||(l.name+" — "+(e.title||e.card.west));
  e.nested=e.nested||[];
  e.nested.push({lens:l.name,title:ti.trim(),card:cards.join(", "),text:lines.join("\n")});
  ZOOM=null; save(); renderPlay(); toast("Folded into the log.");
}

/* ---------- REGISTER / GRIMOIRE ---------- */
function renderRegister(){
  var r=J(K_REG,[]);
  app().innerHTML='<button class="btn ghost" onclick="'+(S?"renderPlay()":"renderHome()")+'">← Back</button>'+
  '<h1>The register</h1><p class="lede">Everyone and everything you\'ve named across sessions.</p>'+
  (r.length?r.map(function(x,i){return '<div class="entry"><div class="ehead">'+esc(x.name)+'</div>'+
    '<div class="emeta">'+esc(x.lens)+' · '+esc(x.session)+'</div><div class="etext">'+esc(x.note)+'</div>'+
    '<div class="row noprint" style="margin-top:8px"><button class="btn sm ghost" onclick="delReg('+i+')">Remove</button></div></div>'}).join("")
  :'<p class="dim">Nothing named yet. Court cards ask for names — those land here.</p>');
}
function delReg(i){var r=J(K_REG,[]);r.splice(i,1);SJ(K_REG,r);renderRegister()}
function renderGrimoire(){
  var g=J(K_GRIM,{}), keys=Object.keys(g);
  var h='<button class="btn ghost" onclick="renderHome()">← Back</button><h1>Grimoire</h1>'+
  '<p class="lede">Every reading you\'ve written, kept against the card that prompted it.</p>';
  if(!keys.length)h+='<p class="dim">Empty. It fills as you play.</p>';
  else{
    h+=fullDeck().filter(function(c){return g[cardKey(c)]}).map(function(c){
      var list=g[cardKey(c)];
      return '<div class="entry"><div class="ehead">'+esc(c.west)+'</div>'+
      '<div class="emeta">'+esc(c.trad)+' · '+list.length+' reading'+(list.length===1?"":"s")+'</div>'+
      list.map(function(x){return '<p class="small" style="margin:6px 0"><span class="dim">'+esc(x.lens)+
        ' · '+esc(x.at.slice(0,10))+'</span><br>'+esc(x.text)+'</p>'}).join("")+'</div>'}).join("");
    h+='<button class="btn ghost" onclick="if(confirm(\'Erase the whole grimoire?\')){DB.del(K_GRIM);renderGrimoire()}">Erase grimoire</button>';
  }
  app().innerHTML=h;
}

/* ---------- ARCHIVE ---------- */
function renderArchive(){
  var a=J(K_ARCH,[]);
  var h='<button class="btn ghost" onclick="renderHome()">← Back</button><h1>Past sessions</h1>';
  if(!a.length)h+='<p class="dim">No finished sessions yet.</p>';
  else h+=a.map(function(s,i){var l=lensById(s.lens);
    return '<div class="entry"><div class="ehead">'+esc(s.title||"Untitled")+'</div>'+
    '<div class="emeta">'+esc(l?l.name:s.lens)+' · '+esc(s.started.slice(0,10))+' · '+s.entries.length+' cards</div>'+
    '<div class="row"><button class="btn sm" onclick="renderLog('+i+')">Open log</button>'+
    '<button class="btn sm ghost" onclick="renameLog('+i+')">Rename</button>'+
    '<button class="btn sm ghost" onclick="delLog('+i+')">Delete</button></div></div>'}).join("")+
    '<hr class="rule"><button class="btn ghost" onclick="clearArchive()">Delete all past sessions</button>';
  app().innerHTML=h;
}
function renameLog(i){var a=J(K_ARCH,[]);var t=prompt("Rename this session:",a[i].title||"");
  if(t!==null){a[i].title=t.trim();SJ(K_ARCH,a);renderArchive()}}
function delLog(i){var a=J(K_ARCH,[]);
  if(!confirm("Delete the log for “"+(a[i].title||"Untitled")+"”? This cannot be undone."))return;
  a.splice(i,1);SJ(K_ARCH,a);renderArchive();toast("Deleted.")}
function clearArchive(){if(!confirm("Delete every past session log? This cannot be undone."))return;
  DB.del(K_ARCH);renderArchive();toast("All logs deleted.")}

/* ---------- FINISH & LOG ---------- */
function finishSession(){
  if(!S)return renderHome();
  if(!S.entries.length){if(!confirm("Nothing logged. Discard this session?"))return;DB.del(K_SESS);S=null;return renderHome()}
  S.ended=new Date().toISOString();
  var a=J(K_ARCH,[]); a.unshift(JSON.parse(JSON.stringify(S))); SJ(K_ARCH,a);
  DB.del(K_SESS); S=null; renderLog(0);
}
function logSession(i){return J(K_ARCH,[])[i]}
function renderLog(i){
  var s=logSession(i); if(!s)return renderHome();
  var l=lensById(s.lens); setMeta("Session log");
  var body="",ch=null;
  s.entries.forEach(function(e){
    if(s.scale==="full"&&e.chapter!==ch){ch=e.chapter;
      body+='<h2>Chapter '+ch+' — '+esc(CHAPTERS[ch-1]?CHAPTERS[ch-1][0]:"")+'</h2>'}
    body+='<div class="entry'+(e.rev?" rev":"")+'"><div class="ehead">'+esc(e.title||e.card.west)+'</div>'+
      '<div class="emeta">'+esc(e.card.west)+' · '+esc(e.card.trad)+' · '+(e.rev?"reversed":"upright")+'</div>'+
      '<div class="eprompt">'+esc(e.prompt)+'</div><div class="etext">'+esc(e.text)+'</div>'+
      (e.nested||[]).map(function(n){return '<div class="entry nested"><div class="ehead">'+esc(n.title)+'</div>'+
        '<div class="emeta">'+esc(n.lens)+'</div><div class="etext">'+esc(n.text)+'</div></div>'}).join("")+'</div>';
  });
  app().innerHTML='<button class="btn ghost noprint" onclick="renderHome()">← All lenses</button>'+
  '<h1>'+esc(s.title||"Untitled session")+'</h1>'+
  '<p class="lede">'+esc(l?l.name:s.lens)+' — '+esc(l?l.scope:"")+'. '+s.entries.length+' cards, '+
  esc(s.started.slice(0,10))+'.</p><p class="small dim">'+esc(l?l.artifact:"")+'</p><hr class="rule">'+body+
  '<hr class="rule noprint"><h3 class="noprint">Take it with you</h3><div class="row noprint">'+
  '<button class="btn primary" onclick="dl('+i+',\'md\')">Markdown</button>'+
  '<button class="btn" onclick="dl('+i+',\'json\')">JSON</button>'+
  '<button class="btn" onclick="dl('+i+',\'foundry\')">Foundry journal</button>'+
  '<button class="btn" onclick="window.print()">PDF / print</button>'+
  '<button class="btn" onclick="copyMd('+i+')">Copy text</button></div>'+
  '<div class="row noprint" style="margin-top:14px"><button class="btn ghost" onclick="renameLog('+i+')">Rename</button>'+
  '<button class="btn ghost" onclick="delLog('+i+')">Delete this log</button></div>';
}
function toMd(s){
  var l=lensById(s.lens);
  var m="# "+(s.title||"Untitled session")+"\n\n**Lens:** "+(l?l.name:s.lens)+" — "+(l?l.scope:"")+"  \n"+
   "**Artifact:** "+(l?l.artifact:"")+"  \n**Date:** "+s.started.slice(0,10)+"  \n"+
   "**Cards:** "+s.entries.length+" · **Mode:** "+(s.mode==="random"?"app-drawn":"physical deck")+
   (s.rev?" · reversals on":"")+"\n\n---\n\n";
  var ch=null;
  s.entries.forEach(function(e){
    if(s.scale==="full"&&e.chapter!==ch){ch=e.chapter;
      m+="## Chapter "+ch+" — "+(CHAPTERS[ch-1]?CHAPTERS[ch-1][0]:"")+"\n\n"}
    m+="### "+(e.title||e.card.west)+"\n";
    m+="*"+e.card.west+" · "+e.card.trad+" · "+(e.rev?"reversed":"upright")+"*\n\n> "+e.prompt+"\n\n"+e.text+"\n\n";
    (e.nested||[]).forEach(function(n){
      m+="#### "+n.title+"\n\n"+n.text.split("\n").map(function(x){return "- "+x}).join("\n")+"\n\n"});
  });
  var names=s.entries.filter(function(e){return e.name});
  if(names.length)m+="---\n\n## Named this session\n\n"+names.map(function(e){return "- **"+e.name+"** ("+e.card.west+")"}).join("\n")+"\n";
  return m;
}
function toFoundry(s){
  var pages=[],ch=null,buf="";
  var flush=function(){if(buf){pages.push({name:(s.scale==="full"&&ch?("Chapter "+ch+" — "+(CHAPTERS[ch-1]?CHAPTERS[ch-1][0]:"")):"Session"),
    type:"text",title:{show:true,level:1},text:{format:1,content:buf}});buf=""}};
  s.entries.forEach(function(e){
    if(s.scale==="full"&&e.chapter!==ch){flush();ch=e.chapter}
    buf+="<h2>"+(e.title||e.card.west)+"</h2><p><em>"+e.card.west+" &middot; "+e.card.trad+" &middot; "+
      (e.rev?"reversed":"upright")+"</em></p><blockquote><p>"+e.prompt+"</p></blockquote><p>"+
      e.text.replace(/\n/g,"<br>")+"</p>"+
      (e.nested||[]).map(function(n){return "<h3>"+n.title+"</h3><p>"+n.text.replace(/\n/g,"<br>")+"</p>"}).join("");
  });
  flush();
  return{name:(s.title||"The Long Ride session"),pages:pages,folder:null,
    flags:{longride:{lens:s.lens,scale:s.scale}},_stats:{systemId:"dnd5e"}};
}
function dl(i,fmt){
  var s=logSession(i); if(!s)return;
  var base=(s.title||"long-ride-session").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
  var data,name,type;
  if(fmt==="md"){data=toMd(s);name=base+".md";type="text/markdown"}
  else if(fmt==="json"){data=JSON.stringify(s,null,2);name=base+".json";type="application/json"}
  else{data=JSON.stringify(toFoundry(s),null,2);name=base+".foundry.json";type="application/json"}
  var b=new Blob([data],{type:type}), u=URL.createObjectURL(b);
  var a=document.createElement("a");a.href=u;a.download=name;a.click();
  setTimeout(function(){URL.revokeObjectURL(u)},1500); toast("Saved "+name);
}
function copyMd(i){
  var s=logSession(i); if(!s)return; var t=toMd(s);
  if(navigator.clipboard)navigator.clipboard.writeText(t).then(function(){toast("Copied.")},function(){fb(t)});
  else fb(t);
  function fb(x){var a=document.createElement("textarea");a.value=x;document.body.appendChild(a);a.select();
    try{document.execCommand("copy");toast("Copied.")}catch(e){toast("Couldn't copy — use Markdown export.")}
    document.body.removeChild(a)}
}

/* ---------- LENS BUILDER ---------- */
function renderLensBuilder(){
  app().innerHTML='<button class="btn ghost" onclick="renderHome()">← Back</button><h1>Build a lens</h1>'+
  '<p class="lede">Five answers and the deck does the rest.</p>'+
  '<label class="fld">Name</label><input type="text" id="bn" placeholder="The Line">'+
  '<div style="height:12px"></div><label class="fld">Scope — what it builds</label><input type="text" id="bs" placeholder="Railroads">'+
  '<div style="height:12px"></div><label class="fld">One-line description</label><input type="text" id="bd" placeholder="Build a rail line and everything it runs over.">'+
  '<div style="height:12px"></div><label class="fld">Artifact — what ends up on the table</label><input type="text" id="ba" placeholder="A route map, a company sheet, a list of stops.">'+
  '<div style="height:12px"></div><label class="fld">Six-Guns / Wands means…</label><input type="text" id="b1" placeholder="sabotage, strikes, hired guns">'+
  '<div style="height:8px"></div><label class="fld">Springs / Cups means…</label><input type="text" id="b2" placeholder="crews, towns served, water stops">'+
  '<div style="height:8px"></div><label class="fld">Rails / Swords means…</label><input type="text" id="b3" placeholder="charters, surveys, engineering">'+
  '<div style="height:8px"></div><label class="fld">Claims / Pentacles means…</label><input type="text" id="b4" placeholder="land grants, freight, capital">'+
  '<div style="height:12px"></div><label class="fld">Quick draw — three positions, comma separated</label>'+
  '<input type="text" id="bq" placeholder="Where it starts, What it crosses, Who pays">'+
  '<div style="height:12px"></div><label class="fld">The frame — the one question every card answers</label>'+
  '<input type="text" id="bf" placeholder="What does this do to the line, or to what\'s in its way?">'+
  '<hr class="rule"><button class="btn primary" onclick="saveLens()">Save this lens</button>';
}
function saveLens(){
  var g=function(id){return document.getElementById(id).value.trim()};
  if(!g("bn")){toast("It needs a name.");return}
  var frame=g("bf")||"What does this reveal?";
  var l={id:"c"+Date.now(),name:g("bn"),scope:g("bs")||"Custom",desc:g("bd")||"",artifact:g("ba")||"",custom:true,
    frame:frame,
    deck:["Full 78-card deck.","Big Sky cards open chapters; Frontier cards fill in the detail.","Court cards are people — name them."],
    suits:[g("b1")||SUITS[0][2],g("b2")||SUITS[1][2],g("b3")||SUITS[2][2],g("b4")||SUITS[3][2]],
    courts:["A newcomer","An agent in the field","A woman with power here","A man with power here"],
    world:"The final shape of it.",
    quick:(g("bq")||"What's here, What's coming, What's buried").split(",").map(function(s){return s.trim()}).slice(0,3),
    p:MAJORS.map(function(m){return m[2].charAt(0).toUpperCase()+m[2].slice(1)+". "+frame})};
  var c=J(K_LENS,[]);c.push(l);SJ(K_LENS,c);toast("Lens saved.");renderHome();
}

/* ---------- BOOT ---------- */
renderHome();
if("serviceWorker" in navigator){try{navigator.serviceWorker.register("sw.js")}catch(e){}}
</script>
</body>
