<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1119">
<title>The Long Ride</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --ink:#0E1119; --ink-2:#161B27; --ink-3:#1F2634;
  --bone:#E9E3D5; --bone-dim:#A9A290;
  --brass:#C9922F; --verdigris:#6E9285; --rust:#94433A;
  --rule:#2C3444;
  --serif:"Hoefler Text","Baskerville","Palatino Linotype",Palatino,Georgia,serif;
  --sans:"Avenir Next","Segoe UI",Roboto,system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--ink);color:var(--bone);font-family:var(--serif);font-size:17px;line-height:1.6}
body{padding-bottom:env(safe-area-inset-bottom)}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.wrap{max-width:760px;margin:0 auto;padding:0 20px 96px}
header.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  padding:20px 0 14px;border-bottom:1px solid var(--rule);margin-bottom:26px;flex-wrap:wrap}
.brand{font-size:23px;letter-spacing:.02em;font-weight:600}
.brand em{font-style:normal;color:var(--brass)}
.top-meta{font-family:var(--sans);font-size:13px;color:var(--bone-dim)}

h1{font-size:40px;line-height:1.12;font-weight:600;margin:0 0 10px}
h2{font-size:25px;font-weight:600;margin:36px 0 12px}
h3{font-size:19px;font-weight:600;margin:22px 0 8px}
p{margin:0 0 14px;max-width:66ch}
.lede{color:var(--bone-dim);max-width:60ch}
.sans{font-family:var(--sans)}
.dim{color:var(--bone-dim)}
.small{font-size:14px}

.btn{background:transparent;border:1px solid var(--rule);color:var(--bone);
  padding:11px 18px;border-radius:2px;cursor:pointer;font-family:var(--sans);font-size:15px}
.btn:hover{border-color:var(--brass);color:var(--brass)}
.btn.primary{background:var(--brass);border-color:var(--brass);color:#15100A;font-weight:600}
.btn.primary:hover{background:#DBA33D;color:#15100A}
.btn.ghost{border-color:transparent;color:var(--bone-dim);padding-left:0}
.btn.ghost:hover{color:var(--brass)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.sm{padding:7px 12px;font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{justify-content:space-between}

input[type=text],textarea,select{width:100%;background:var(--ink-2);border:1px solid var(--rule);
  border-radius:2px;padding:11px 13px;font-family:var(--sans);font-size:15px}
textarea{font-family:var(--serif);font-size:17px;line-height:1.65;min-height:150px;resize:vertical}
label.fld{display:block;font-family:var(--sans);font-size:13px;color:var(--bone-dim);margin:0 0 6px}

/* lens picker */
.lens-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule)}
.lens{background:var(--ink);padding:16px 17px;text-align:left;cursor:pointer;border:0;display:block;width:100%}
.lens:hover{background:var(--ink-2)}
.lens[aria-pressed=true]{background:var(--ink-3);box-shadow:inset 3px 0 0 var(--brass)}
.lens .ln{font-size:19px;font-weight:600;margin-bottom:2px}
.lens .lscope{font-family:var(--sans);font-size:12.5px;color:var(--brass)}
.lens .ldesc{font-family:var(--sans);font-size:13px;color:var(--bone-dim);margin-top:7px;line-height:1.45}

/* deck guidance */
.deckbox{border:1px solid var(--rule);border-left:3px solid var(--verdigris);padding:15px 18px;margin:22px 0;background:var(--ink-2)}
.deckbox h4{margin:0 0 8px;font-size:16px;font-weight:600;color:var(--verdigris)}
.deckbox ul{margin:0;padding-left:19px;font-family:var(--sans);font-size:14.5px;line-height:1.6}
.deckbox li{margin-bottom:5px}

/* the drawn card — the hero */
.card-stage{border:1px solid var(--rule);background:linear-gradient(180deg,var(--ink-2),var(--ink));padding:30px 26px;margin:22px 0;position:relative}
.card-stage.rev{border-color:var(--rust)}
.card-arcana{font-family:var(--sans);font-size:12.5px;color:var(--bone-dim);margin-bottom:9px}
.card-name{font-size:36px;line-height:1.1;font-weight:600;margin:0 0 4px}
.card-stage.rev .card-name{color:var(--rust)}
.card-trad{font-family:var(--sans);font-size:14px;color:var(--bone-dim);margin-bottom:16px}
.card-orient{display:inline-block;font-family:var(--sans);font-size:12px;letter-spacing:.06em;
  border:1px solid var(--rule);padding:3px 9px;border-radius:2px;color:var(--bone-dim);margin-bottom:16px}
.card-stage.rev .card-orient{border-color:var(--rust);color:var(--rust)}
.meaning{border-top:1px solid var(--rule);padding-top:15px;margin-top:4px}
.meaning .lbl{font-family:var(--sans);font-size:12.5px;color:var(--bone-dim);margin-bottom:4px}
.prompt{font-size:21px;line-height:1.45;color:var(--brass);margin:0 0 16px;max-width:60ch}
.reminder{font-family:var(--sans);font-size:14.5px;color:var(--bone-dim);line-height:1.55;max-width:66ch}

.chapline{font-family:var(--sans);font-size:13px;color:var(--bone-dim);
  display:flex;gap:14px;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid var(--rule);margin-bottom:6px}
.chapline b{color:var(--bone);font-weight:600}

/* log entries */
.entry{border-left:2px solid var(--rule);padding:2px 0 2px 16px;margin:0 0 20px}
.entry.rev{border-left-color:var(--rust)}
.entry .ehead{font-size:19px;font-weight:600}
.entry .emeta{font-family:var(--sans);font-size:12.5px;color:var(--bone-dim);margin-bottom:6px}
.entry .eprompt{color:var(--brass);font-size:16px;margin-bottom:6px}
.entry .etext{white-space:pre-wrap}
.entry.nested{margin-left:22px;border-left-style:dashed}

/* named register */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--rule);border-radius:2px;padding:6px 11px;font-family:var(--sans);font-size:13.5px;
  background:var(--ink-2);cursor:pointer}
.chip:hover{border-color:var(--brass);color:var(--brass)}
.chip .k{color:var(--bone-dim);font-size:11.5px}

hr.rule{border:0;border-top:1px solid var(--rule);margin:30px 0}
.hidden{display:none!important}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:var(--ink-3);
  border:1px solid var(--brass);color:var(--bone);padding:11px 18px;font-family:var(--sans);font-size:14px;z-index:50}
.suggest{border:1px solid var(--rule);border-top:0;background:var(--ink-2);max-height:210px;overflow:auto}
.suggest button{display:block;width:100%;text-align:left;background:transparent;border:0;padding:9px 13px;
  cursor:pointer;font-family:var(--sans);font-size:14.5px}
.suggest button:hover,.suggest button.sel{background:var(--ink-3);color:var(--brass)}
@media print{body{background:#fff;color:#000}.noprint{display:none!important}
  .entry{border-left:2px solid #999}.prompt,.eprompt{color:#6b4d10}}
@media (max-width:520px){h1{font-size:31px}.card-name{font-size:29px}.prompt{font-size:19px}}
</style>
</head>

 ["The Cattle Baron","The Emperor","Authority; control; who is really in charge","Structure, dominion, protection through order. Reversed: tyranny, rigidity, authority that has rotted."],

 ["The Prospector","The Hermit","Isolation; obsession; the one who went too far alone","Solitude, inner search, hard-won wisdom. Reversed: exile, paranoia, an obsession that consumed someone."],
 ["The Gold Strike","Wheel of Fortune","Fortune's turn; sudden abundance or loss","Cycles, luck, a turning point beyond anyone's control. Reversed: the turn goes against you; bad timing."],
 ["The Circuit Judge","Justice","Judgment; consequence; a dispute settled","Truth, fairness, cause and effect. Reversed: corruption, an unjust verdict, consequence dodged."],
 ["The Hanged Man","The Hanged Man","Sacrifice; suspension; the price of seeing clearly","Surrender, a new angle bought with loss, waiting. Reversed: stalling, a pointless sacrifice, martyrdom for show."],
 ["The Range War","Death","An ending; something that cannot come back","Transformation, a clean end, what must be let go. Reversed: clinging, a slow rot, refusing the ending."],

 ["The World","The World","Completion; the final shape; how it is remembered","Wholeness, the end of a cycle, arrival. Reversed: an ending that will not close; unfinished business."]
];

<script>
/* ============ STORAGE (falls back to memory if blocked) ============ */
var MEM={};
var DB={
  get(k){try{const v=localStorage.getItem(k);return v==null?(MEM[k]??null):v}catch(e){return MEM[k]??null}},
  set(k,v){try{localStorage.setItem(k,v)}catch(e){}MEM[k]=v},
  del(k){try{localStorage.removeItem(k)}catch(e){}delete MEM[k]}
};
var J=(k,d)=>{const v=DB.get(k);if(!v)return d;try{return JSON.parse(v)}catch(e){return d}};
var SJ=(k,o)=>DB.set(k,JSON.stringify(o));

/* ============ CARD MODEL ============ */
function majorCard(i){return{t:"major",i,west:MAJORS[i][0],trad:MAJORS[i][1],theme:MAJORS[i][2],mean:MAJORS[i][3]}}
function minorCard(s,r){return{t:"minor",s,r,west:RANKS[r]+" of "+SUITS[s][0],trad:RANKS[r]+" of "+SUITS[s][1],
  theme:SUITS[s][2],mean:RANKSCALE[r]}}
function fullDeck(){const d=[];for(let i=0;i<22;i++)d.push(majorCard(i));
  for(let s=0;s<4;s++)for(let r=0;r<14;r++)d.push(minorCard(s,r));return d}
function cardKey(c){return c.t==="major"?"M"+c.i:"m"+c.s+"-"+c.r}
function cardLabel(c){return c.west+(c.t==="major"?" ("+c.trad+")":"")}

/* accept traditional or western names, numerals, shorthand */
const NUMWORD={1:"Ace",2:"Two",3:"Three",4:"Four",5:"Five",6:"Six",7:"Seven",8:"Eight",9:"Nine",10:"Ten",
  ace:"Ace",one:"Ace",two:"Two",three:"Three",four:"Four",five:"Five",six:"Six",seven:"Seven",eight:"Eight",
  nine:"Nine",ten:"Ten",page:"Page",jack:"Page",knave:"Page",knight:"Knight",queen:"Queen",king:"King"};
function norm(s){return (s||"").toLowerCase().replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim()}
function parseCard(raw){
  let s=norm(raw), rev=false;
  s=s.replace(/\b(reversed|reverse|rev|inverted|upside down|rx|r)\b\s*$/,()=>{rev=true;return""}).trim();
  s=s.replace(/^\s*(reversed|rev)\b/,()=>{rev=true;return""}).trim();
  if(!s)return null;
  const bare=s.replace(/^the /,"");
  for(let i=0;i<22;i++){
    const w=norm(MAJORS[i][0]).replace(/^the /,""), t=norm(MAJORS[i][1]).replace(/^the /,"");
    if(bare===w||bare===t||s===norm(MAJORS[i][0])||s===norm(MAJORS[i][1]))return{card:majorCard(i),rev};
  }
  // suit first — match the longest alias at the end of the string
  const ALIAS=[
    [0,["six guns","sixguns","six gun","wands","wand","staves","staffs","rods","batons","clubs"]],
    [1,["springs","spring","cups","cup","chalices","hearts","vessels"]],
    [2,["rails","rail","swords","sword","blades","spades"]],
    [3,["claims","claim","pentacles","pentacle","coins","coin","disks","discs","coins","diamonds"]]
  ];
  let si=-1, rest=null;
  for(const [idx,names] of ALIAS)
    for(const nm of names){
      if(s===nm||s.endsWith(" "+nm)){
        const r=s.slice(0,s.length-nm.length).replace(/\bof\s*$/,"").trim();
        if(si<0||nm.length>(rest===null?0:0)){si=idx;rest=r}
      }
    }
  if(si>=0&&rest!==null&&rest){
    const first=rest.split(" ")[0];
    const rw=NUMWORD[first]||NUMWORD[parseInt(first)]||null;
    if(rw)return{card:minorCard(si,RANKS.indexOf(rw)),rev};
  }
  return null;
}
function searchCards(q){
  const n=norm(q); if(!n)return[];
  return fullDeck().filter(c=>norm(c.west).includes(n)||norm(c.trad).includes(n)).slice(0,8);
}

/* ============ STATE ============ */
var S=null; // active session
var K_SESS="lr.session", K_ARCH="lr.archive", K_GRIM="lr.grimoire", K_REG="lr.register", K_LENS="lr.customlenses";
function allLenses(){return LENSES.concat(J(K_LENS,[]))}
function lensById(id){return allLenses().find(l=>l.id===id)}

function newSession(lensId,opts){
  return{id:"s"+Date.now(),lens:lensId,title:opts.title||"",mode:opts.mode,rev:opts.rev,scale:opts.scale,
    started:new Date().toISOString(),chapter:1,drawn:[],entries:[],pending:null,parent:opts.parent||null};
}
function save(){if(S)SJ(K_SESS,S)}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.remove("hidden");
  clearTimeout(t._h);t._h=setTimeout(()=>t.classList.add("hidden"),2200)}
function esc(s){return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

/* ============ DRAW ============ */
function remaining(){
  const used=new Set(S.drawn);
  return fullDeck().filter(c=>!used.has(cardKey(c)));
}
function drawRandom(majorsOnly){
  let pool=remaining();
  if(majorsOnly)pool=pool.filter(c=>c.t==="major");
  if(!pool.length)return null;
  const c=pool[Math.floor(Math.random()*pool.length)];
  const rev=S.rev?Math.random()<0.5:false;
  return{card:c,rev};
}
function promptFor(card,lens){
  if(card.t==="major"){
    const ov=J("lr.override."+lens.id,{});
    return ov[card.i]||lens.p[card.i];
  }
  const suit=lens.suits[card.s], scale=RANKSCALE[card.r];
  if(card.r>=10) return lens.courts[card.r-10]+" — enters through "+SUITS[card.s][0].toLowerCase()+". Who are they, and what do they want?";
  return "["+SUITS[card.s][0]+"] "+suit+". "+scale;
}
function meaningFor(card,rev){
  if(card.t==="major"){
    const parts=card.mean.split("Reversed:");
    return rev?("Reversed — "+(parts[1]||"the card's meaning, blocked, twisted, or false.").trim()):parts[0].trim();
  }
  return SUITS[card.s][0]+" ("+SUITS[card.s][1]+"): "+card.theme+". "+card.mean+
    (rev?" Reversed: it fails, backfires, or is not what it appears.":"");
}
</script>

function pick(rowId,btn){document.querySelectorAll("#"+rowId+" .btn").forEach(b=>b.classList.remove("primary"));btn.classList.add("primary")}
function picked(rowId){const b=document.querySelector("#"+rowId+" .btn.primary");return b?b.dataset.v:null}

function startSession(id,parent){
  S=newSession(id,{title:document.getElementById("ttl").value.trim(),mode:picked("modeRow"),
    rev:picked("revRow")==="1",scale:picked("sclRow"),parent:parent});
  save(); renderPlay();
}
function resumeSession(){S=J(K_SESS,null);S?renderPlay():renderHome()}

/* ---------- PLAY ---------- */
function chapterTarget(){return S.scale==="quick"?3:(S.scale==="short"?8:40)}
function renderPlay(){
  VIEW="play";
  const l=lensById(S.lens); setMeta(l.name+(S.title?" · "+S.title:""));
  const n=S.entries.length, q=S.scale==="quick";
  let h=`<div class="chapline">
    <span><b>${esc(l.name)}</b></span>
    ${S.title?`<span>${esc(S.title)}</span>`:""}
    ${q?`<span>Quick draw · ${n}/3</span>`:`<span>Chapter <b>${S.chapter}</b></span><span>${n} card${n===1?"":"s"} logged</span>`}
    <span>${S.mode==="random"?"App draws":"You type"}${S.rev?" · reversals on":""}</span>
    <span class="dim">${remaining().length} left in deck</span>
  </div>`;

  if(q&&n<3) h+=`<p class="small dim" style="margin-top:12px">Position ${n+1}: <b>${esc(l.quick[n])}</b></p>`;

  if(S.pending){ h+=cardStageHTML(S.pending,l); }
  else if(q&&n>=3){ h+=`<h2>That's the spread.</h2><p class="lede">Three cards, three answers. Close it out and take the log.</p>`; }
  else { h+=drawControlsHTML(l); }

  if(S.entries.length){
    h+=`<hr class="rule"><h2>This session</h2>`+S.entries.map((e,i)=>entryHTML(e,i)).join("");
  }
  h+=`<hr class="rule"><div class="row spread">
    <div class="row">
      ${(!q&&S.scale!=="quick")?`<button class="btn" onclick="nextChapter()">End chapter ${S.chapter}</button>`:""}

    </div>
    <div class="row">
      <button class="btn primary" onclick="finishSession()">Finish &amp; generate log</button>
      <button class="btn ghost" onclick="renderHome()">Pause</button>
    </div></div>`;
  app().innerHTML=h;
  const inp=document.getElementById("cardin"); if(inp){inp.focus();inp.oninput=onCardInput;inp.onkeydown=onCardKey}
}
function drawControlsHTML(l){
  const majorsOnly=(S.scale!=="quick"&&S.entries.length===0)||false;
  if(S.mode==="random"){
    return `<div class="row" style="margin:24px 0">
      <button class="btn primary" onclick="doDraw(false)">Draw a card</button>

  }
  return `<div style="margin:24px 0">
    <label class="fld" for="cardin">Type the card you drew</label>
    <input type="text" id="cardin" autocomplete="off" autocapitalize="off" spellcheck="false"
      placeholder="e.g. Three of Cups reversed — or The Fool, 7 of Wands, Knight of Springs">
    <div id="sugg" class="suggest hidden"></div>
    <p class="small dim" style="margin-top:8px">Traditional or Western names both work. Add “reversed” or “rev” at the end for an inverted card.</p>
  </div>`;
}
var SUG=[],SUGI=-1;
function onCardInput(e){
  const v=e.target.value, box=document.getElementById("sugg");
  const p=parseCard(v);
  SUG=searchCards(v.replace(/\b(reversed|rev|r)\b\s*$/i,"")); SUGI=-1;
  if(p&&SUG.length<=1){box.classList.add("hidden");return}
  if(!SUG.length){box.classList.add("hidden");return}
  box.classList.remove("hidden");
  box.innerHTML=SUG.map((c,i)=>`<button onclick="chooseSug(${i})">${esc(c.west)} <span class="dim">· ${esc(c.trad)}</span></button>`).join("");
}
function chooseSug(i){
  const inp=document.getElementById("cardin");
  const rev=/\b(reversed|rev)\b/i.test(inp.value);
  inp.value=SUG[i].west+(rev?" reversed":"");
  document.getElementById("sugg").classList.add("hidden"); submitCard();
}
function onCardKey(e){
  const box=document.getElementById("sugg");
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){
    if(!SUG.length)return; e.preventDefault();
    SUGI=(SUGI+(e.key==="ArrowDown"?1:SUG.length-1))%SUG.length;
    [...box.children].forEach((b,i)=>b.classList.toggle("sel",i===SUGI));
  } else if(e.key==="Enter"){ e.preventDefault(); if(SUGI>=0)chooseSug(SUGI); else submitCard(); }
}
function submitCard(){
  const inp=document.getElementById("cardin"); const p=parseCard(inp.value);
  if(!p){toast("Didn't catch that card. Try “Three of Cups” or “The Tower”.");return}
  if(!S.rev)p.rev=false;

  S.pending={key:cardKey(p.card),card:p.card,rev:p.rev,text:""}; save(); renderPlay();
}
function doDraw(majorsOnly){
  const d=drawRandom(majorsOnly);
  if(!d){toast(majorsOnly?"No Big Sky cards left.":"The deck is spent.");return}
  S.pending={key:cardKey(d.card),card:d.card,rev:d.rev,text:""}; save(); renderPlay();
}
function cardStageHTML(pend,l){
  const c=pend.card, isCourt=(c.t==="minor"&&c.r>=10);

    </div>

    <textarea id="interp" placeholder="${isCourt?"Give this person a name, then write who they are.":"Write what this means in your world."}">${esc(pend.text)}</textarea>
    ${isCourt?`<div style="height:12px"></div><label class="fld" for="nm">Name for the register</label>
      <input type="text" id="nm" placeholder="Their name">`:""}
    <div style="height:14px"></div>
    <div class="row">
      <button class="btn primary" onclick="commitEntry()">Log it${prevGrim(pend.key)?"":""}</button>
      <button class="btn" onclick="S.pending=null;save();renderPlay()">Discard this card</button>
    </div>
    ${prevGrim(pend.key)}
  </div>`;
}
function prevGrim(key){
  const g=J(K_GRIM,{})[key]||[];
  if(!g.length)return "";
  return `<div style="margin-top:18px;border-top:1px solid var(--rule);padding-top:12px">
    <div class="lbl small dim">You've read this card before</div>`+
    g.slice(-3).map(x=>`<p class="small dim" style="margin:6px 0"><b>${esc(x.lens)}</b> — ${esc(x.text.slice(0,180))}${x.text.length>180?"…":""}</p>`).join("")+`</div>`;
}
function commitEntry(){
  const t=document.getElementById("interp").value.trim();
  const nmEl=document.getElementById("nm"); const nm=nmEl?nmEl.value.trim():"";
  if(!t){toast("Write something first — even one line.");return}
  const l=lensById(S.lens);
  const e={key:S.pending.key,card:S.pending.card,rev:S.pending.rev,text:t,name:nm,
    chapter:S.chapter,at:new Date().toISOString(),prompt:promptFor(S.pending.card,l),staked:!!nm,nested:[]};
  S.entries.push(e); S.drawn.push(S.pending.key); S.pending=null;
  const g=J(K_GRIM,{}); (g[e.key]=g[e.key]||[]).push({lens:l.name,text:t,at:e.at}); SJ(K_GRIM,g);
  if(nm){const r=J(K_REG,[]);r.push({name:nm,lens:l.name,session:S.title||"Untitled",note:t.slice(0,240),at:e.at});SJ(K_REG,r)}
  save(); renderPlay();
}
function entryHTML(e,i){
  return `<div class="entry${e.rev?" rev":""}">
    <div class="ehead">${esc(e.card.west)}${e.rev?" — reversed":""}${e.name?" · "+esc(e.name):""}</div>
    <div class="emeta">${esc(e.card.trad)} · chapter ${e.chapter}</div>
    <div class="eprompt">${esc(e.prompt)}</div>
    <div class="etext">${esc(e.text)}</div>
    <div class="row noprint" style="margin-top:8px">
      <button class="btn sm ghost" onclick="stakeZoom(${i})">Zoom into this</button>
      <button class="btn sm ghost" onclick="editEntry(${i})">Edit</button>
    </div>
    ${(e.nested||[]).map(n=>`<div class="entry nested"><div class="ehead">${esc(n.title)}</div>
      <div class="emeta">${esc(n.lens)} · quick draw</div><div class="etext">${esc(n.text)}</div></div>`).join("")}
  </div>`;
}
function editEntry(i){
  const e=S.entries[i]; const t=prompt("Edit your interpretation:",e.text);
  if(t!==null&&t.trim()){e.text=t.trim();save();renderPlay()}
}
function nextChapter(){
  if(S.scale==="full"&&S.chapter>=5){toast("Five chapters done. Finish and take the log.");return}
  S.chapter++; save(); renderPlay(); toast("Chapter "+S.chapter);
}
</script>
<script>
/* ---------- STAKE & ZOOM ---------- */
var ZOOM=null;
function stakeZoom(i){
  ZOOM={idx:i}; const e=S.entries[i];
  const subject=e.name||e.card.west;
  app().innerHTML=`<button class="btn ghost" onclick="ZOOM=null;renderPlay()">← Back to the session</button>
  <h1>Zoom in</h1>
  <p class="lede">You're zooming into <b>${esc(subject)}</b>. Pick a lens and pull a three-card quick draw.
  The result gets folded back into this session's log, under that card.</p>
  <div class="lens-grid">`+allLenses().filter(l=>l.id!==S.lens).map(l=>
    `<button class="lens" onclick="runZoom('${l.id}')"><div class="ln">${esc(l.name)}</div>
     <div class="lscope">${esc(l.scope)}</div><div class="ldesc">${esc(l.quick.join(" / "))}</div></button>`).join("")+
  `</div>`;
}
function runZoom(lensId){
  const l=lensById(lensId), e=S.entries[ZOOM.idx], subject=e.name||e.card.west;
  const cards=[]; const used=new Set(S.drawn);
  const pool=fullDeck().filter(c=>!used.has(cardKey(c)));
  if(S.mode==="random"){
    for(let k=0;k<3&&pool.length;k++){const j=Math.floor(Math.random()*pool.length);
      const c=pool.splice(j,1)[0]; cards.push({card:c,rev:S.rev?Math.random()<0.5:false});}
  }
  let h=`<button class="btn ghost" onclick="ZOOM=null;renderPlay()">← Back</button>
  <h1>${esc(l.name)}: ${esc(subject)}</h1>`;
  for(let k=0;k<3;k++){
    const pos=l.quick[k];
    if(cards[k]){
      const c=cards[k];
      h+=`<div class="card-stage${c.rev?" rev":""}"><div class="card-arcana">${esc(pos)}</div>
        <div class="card-name">${esc(c.card.west)}</div><div class="card-trad">${esc(c.card.trad)} · ${c.rev?"Reversed":"Upright"}</div>
        <div class="meaning"><p class="prompt">${esc(promptFor(c.card,l))}</p>
        <p class="reminder">${esc(meaningFor(c.card,c.rev))}</p></div>
        <div style="height:14px"></div><textarea id="z${k}" placeholder="Your reading."></textarea></div>`;
    } else {
      h+=`<div class="card-stage"><div class="card-arcana">${esc(pos)}</div>
        <label class="fld" for="zc${k}">Type the card you drew</label>
        <input type="text" id="zc${k}" placeholder="e.g. Five of Swords reversed">
        <div style="height:12px"></div><textarea id="z${k}" placeholder="Your reading."></textarea></div>`;
    }
  }
  h+=`<button class="btn primary" onclick='saveZoom(${JSON.stringify(lensId)},${JSON.stringify(cards.map(c=>({k:cardKey(c.card),w:c.card.west,r:c.rev})))})'>Fold this back in</button>`;
  app().innerHTML=h;
}
function saveZoom(lensId,cardMeta){
  const l=lensById(lensId), e=S.entries[ZOOM.idx];
  let lines=[];
  for(let k=0;k<3;k++){
    const txt=(document.getElementById("z"+k)||{}).value||"";
    let cname=cardMeta[k]?cardMeta[k].w+(cardMeta[k].r?" (reversed)":""):
      ((document.getElementById("zc"+k)||{}).value||"—");
    if(txt.trim())lines.push(l.quick[k]+" — "+cname+": "+txt.trim());
    if(cardMeta[k])S.drawn.push(cardMeta[k].k);
  }
  if(!lines.length){toast("Nothing written — nothing folded in.");return}
  e.nested=e.nested||[];
  e.nested.push({lens:l.name,title:l.name+" on "+(e.name||e.card.west),text:lines.join("\n")});
  ZOOM=null; save(); renderPlay(); toast("Folded into the log.");
}

/* ---------- REGISTER / GRIMOIRE / ARCHIVE ---------- */
function regCount(){return J(K_REG,[]).length}
function renderRegister(){
  const r=J(K_REG,[]);
  app().innerHTML=`<button class="btn ghost" onclick="${S?"renderPlay()":"renderHome()"}">← Back</button>
  <h1>The register</h1>
  <p class="lede">Everyone and everything you've named across sessions. Barons, beasts, towns — they can ride into the next region with you.</p>`+
  (r.length?`<div class="chips">`+r.map((x,i)=>`<button class="chip" onclick="alert(${JSON.stringify(JSON.stringify(x.name+" — "+x.lens+" ("+x.session+")\n\n"+x.note)).replace(/'/g,"&#39;")})">
    ${esc(x.name)} <span class="k">${esc(x.lens)}</span></button>`).join("")+`</div>
    <div style="height:20px"></div><button class="btn ghost" onclick="if(confirm('Clear the whole register?')){DB.del(K_REG);renderRegister()}">Clear register</button>`
  :`<p class="dim">Nothing named yet. Court cards ask for names — those land here.</p>`);
}
function renderGrimoire(){
  const g=J(K_GRIM,{}); const keys=Object.keys(g);
  let h=`<button class="btn ghost" onclick="renderHome()">← Back</button><h1>Grimoire</h1>
  <p class="lede">Every reading you've ever written, kept against the card that prompted it. The same card means something different each time you meet it.</p>`;
  if(!keys.length)h+=`<p class="dim">Empty. It fills as you play.</p>`;
  else{
    const deck=fullDeck();
    h+=deck.filter(c=>g[cardKey(c)]).map(c=>{
      const list=g[cardKey(c)];
      return `<div class="entry"><div class="ehead">${esc(c.west)}</div>
      <div class="emeta">${esc(c.trad)} · ${list.length} reading${list.length===1?"":"s"}</div>`+
      list.map(x=>`<p class="small" style="margin:4px 0"><span class="dim">${esc(x.lens)} · ${esc(x.at.slice(0,10))}</span><br>${esc(x.text)}</p>`).join("")+`</div>`;
    }).join("");
    h+=`<button class="btn ghost" onclick="if(confirm('Erase the grimoire?')){DB.del(K_GRIM);renderGrimoire()}">Erase grimoire</button>`;
  }
  app().innerHTML=h;
}
function renderArchive(){
  const a=J(K_ARCH,[]);
  let h=`<button class="btn ghost" onclick="renderHome()">← Back</button><h1>Past sessions</h1>`;
  if(!a.length)h+=`<p class="dim">No finished sessions yet.</p>`;
  else h+=a.map((s,i)=>`<div class="entry"><div class="ehead">${esc(s.title||"Untitled")}</div>
    <div class="emeta">${esc(lensById(s.lens)?lensById(s.lens).name:s.lens)} · ${esc(s.started.slice(0,10))} · ${s.entries.length} cards</div>
    <div class="row"><button class="btn sm" onclick="renderLog(${i})">Open log</button></div></div>`).join("");

}

/* ---------- FINISH & LOG ---------- */
function finishSession(){
  if(!S){renderHome();return}
  if(!S.entries.length){if(!confirm("Nothing logged. Discard?"))return;DB.del(K_SESS);S=null;return renderHome()}
  S.ended=new Date().toISOString();
  const a=J(K_ARCH,[]); a.unshift(JSON.parse(JSON.stringify(S))); SJ(K_ARCH,a);
  DB.del(K_SESS); S=null; renderLog(0);
}
function logSession(i){return J(K_ARCH,[])[i]}
function renderLog(i){
  const s=logSession(i); if(!s)return renderHome();
  const l=lensById(s.lens);
  setMeta("Session log");
  app().innerHTML=`<button class="btn ghost noprint" onclick="renderHome()">← All lenses</button>
  <h1>${esc(s.title||"Untitled session")}</h1>
  <p class="lede">${esc(l?l.name:s.lens)} — ${esc(l?l.scope:"")}. ${s.entries.length} cards,
  ${s.chapter} chapter${s.chapter===1?"":"s"}, ${esc(s.started.slice(0,10))}.</p>
  <p class="small dim">${esc(l?l.artifact:"")}</p>
  <hr class="rule">
  ${groupByChapter(s)}
  <hr class="rule noprint">
  <h3 class="noprint">Take it with you</h3>
  <div class="row noprint">
    <button class="btn primary" onclick="dl(${i},'md')">Markdown</button>
    <button class="btn" onclick="dl(${i},'json')">JSON</button>
    <button class="btn" onclick="dl(${i},'foundry')">Foundry journal</button>
    <button class="btn" onclick="window.print()">PDF / print</button>
    <button class="btn" onclick="copyMd(${i})">Copy text</button>

}
function groupByChapter(s){
  let out="",ch=null;
  s.entries.forEach(e=>{
    if(e.chapter!==ch){ch=e.chapter;if(s.scale!=="quick")out+=`<h2>Chapter ${ch}</h2>`}
    out+=`<div class="entry${e.rev?" rev":""}">
      <div class="ehead">${esc(e.card.west)}${e.rev?" — reversed":""}${e.name?" · "+esc(e.name):""}</div>
      <div class="emeta">${esc(e.card.trad)}</div>
      <div class="eprompt">${esc(e.prompt)}</div>
      <div class="etext">${esc(e.text)}</div>
      ${(e.nested||[]).map(n=>`<div class="entry nested"><div class="ehead">${esc(n.title)}</div>
        <div class="etext">${esc(n.text)}</div></div>`).join("")}
    </div>`;
  });
  return out;
}
function toMd(s){
  const l=lensById(s.lens);
  let m=`# ${s.title||"Untitled session"}\n\n**Lens:** ${l?l.name:s.lens} — ${l?l.scope:""}  \n`+
   `**Artifact:** ${l?l.artifact:""}  \n**Date:** ${s.started.slice(0,10)}  \n`+
   `**Cards:** ${s.entries.length} · **Chapters:** ${s.chapter} · **Mode:** ${s.mode==="random"?"app-drawn":"physical deck"}`+
   `${s.rev?" · reversals on":""}\n\n---\n\n`;
  let ch=null;
  s.entries.forEach(e=>{
    if(e.chapter!==ch){ch=e.chapter;if(s.scale!=="quick")m+=`## Chapter ${ch}\n\n`}
    m+=`### ${e.card.west}${e.rev?" (reversed)":""}${e.name?" — "+e.name:""}\n`;
    m+=`*${e.card.trad}*\n\n> ${e.prompt}\n\n${e.text}\n\n`;
    (e.nested||[]).forEach(n=>{m+=`**${n.title}**\n\n${n.text.split("\n").map(x=>"- "+x).join("\n")}\n\n`});
  });
  const names=s.entries.filter(e=>e.name);
  if(names.length)m+=`---\n\n## Named this session\n\n`+names.map(e=>`- **${e.name}** (${e.card.west})`).join("\n")+"\n";
  return m;
}
function toFoundry(s){
  const l=lensById(s.lens);
  const pages=[];
  let ch=null,buf="",n=1;
  const flush=()=>{if(buf){pages.push({name:(s.scale==="quick"?"Quick draw":"Chapter "+ch),type:"text",
    title:{show:true,level:1},text:{format:1,content:buf}});buf=""}};
  s.entries.forEach(e=>{
    if(e.chapter!==ch){flush();ch=e.chapter}
    buf+=`<h2>${e.card.west}${e.rev?" (reversed)":""}${e.name?" &mdash; "+e.name:""}</h2>`+
      `<p><em>${e.card.trad}</em></p><blockquote><p>${e.prompt}</p></blockquote>`+
      `<p>${e.text.replace(/\n/g,"<br>")}</p>`+
      (e.nested||[]).map(x=>`<h3>${x.title}</h3><p>${x.text.replace(/\n/g,"<br>")}</p>`).join("");
  });
  flush();
  return {name:(s.title||"The Long Ride session"),pages:pages,folder:null,flags:{longride:{lens:s.lens,scale:s.scale}},
    _stats:{systemId:"dnd5e"}};
}
function dl(i,fmt){
  const s=logSession(i); if(!s)return;
  const base=(s.title||"long-ride-session").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
  let data,name,type;
  if(fmt==="md"){data=toMd(s);name=base+".md";type="text/markdown"}
  else if(fmt==="json"){data=JSON.stringify(s,null,2);name=base+".json";type="application/json"}
  else{data=JSON.stringify(toFoundry(s),null,2);name=base+".foundry.json";type="application/json"}
  const b=new Blob([data],{type}); const u=URL.createObjectURL(b);
  const a=document.createElement("a"); a.href=u; a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(u),1500); toast("Saved "+name);
}
function copyMd(i){
  const s=logSession(i); if(!s)return;
  const t=toMd(s);
  if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>toast("Copied."),()=>fallbackCopy(t));
  else fallbackCopy(t);
}
function fallbackCopy(t){const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);
  a.select();try{document.execCommand("copy");toast("Copied.")}catch(e){toast("Couldn't copy — use Markdown export.")}
  document.body.removeChild(a)}

function saveLens(){
  const g=id=>document.getElementById(id).value.trim();
  if(!g("bn")){toast("It needs a name.");return}
  const frame=g("bf")||"What does this reveal?";
  const l={id:"c"+Date.now(),name:g("bn"),scope:g("bs")||"Custom",desc:g("bd")||"",
    artifact:g("ba")||"",custom:true,
    deck:["Full 78-card deck.","Big Sky cards open chapters; Frontier cards fill in detail.","Court cards are people — name them."],
    suits:[g("b1")||SUITS[0][2],g("b2")||SUITS[1][2],g("b3")||SUITS[2][2],g("b4")||SUITS[3][2]],
